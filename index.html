study('arcos-radianos',[['Uma volta completa?','360°=2π rad.'],['Meia volta?','180°=π rad.'],['Graus para radianos?','Multiplique por π/180.'],['Radianos para graus?','Multiplique por 180/π.'],['225° em radianos?','5π/4 rad.'],['Arcos côngruos?','Têm o mesmo ponto final; diferem por voltas completas.']],['Registre 360°=2π rad e 180°=π rad.','Monte duas setas: graus→radianos (×π/180) e radianos→graus (×180/π).','Resolva conversões simplificando a fração antes de concluir.','Explique como somar ou subtrair voltas completas para obter um arco côngruo.'],['Esquecer o fator π ou 180 na conversão.','Somar/subtrair voltas que deixam o resultado fora do intervalo pedido.','Confundir o número de voltas com a medida angular.'],['Por que π rad corresponde a 180°?','Como converter 315° em radianos?','Como reduzir −7π/4 ao intervalo [0,2π)?']);
study('ciclo-valores',[['Coordenadas do ponto θ no ciclo?','(cos θ, sen θ).'],['Sinal do seno no III quadrante?','Negativo.'],['Sinal do cosseno no II quadrante?','Negativo.'],['sen 30°?','1/2.'],['cos 45°?','√2/2.'],['tg θ quando cos θ≠0?','sen θ/cos θ.']],['Desenhe os quatro quadrantes e marque os sinais de seno e cosseno.','Copie a tabela exata de 30°, 45° e 60° para seno, cosseno e tangente.','Marque os ângulos notáveis 0°, 90°, 180°, 270° e 360°.','Pratique identificar quadrante, ângulo de referência e coordenadas.'],['Trocar seno (ordenada) por cosseno (abscissa).','Usar valor positivo sem considerar o quadrante.','Afirmar que a tangente existe quando cos θ=0.'],['Como localizar 7π/4 no ciclo?','Como obter valores no III quadrante pelo ângulo de referência?','Por que tg 90° não está definida?']);
study('funcoes-graficos',[['Período de sen x e cos x?','2π.'],['Período de tg x?','π.'],['T de sen(bx)?','2π/|b|.'],['T de tg(bx)?','π/|b|.'],['Imagem de A sen x?','[−|A|,|A|].'],['Domínio de sen e cos?','Todos os reais.']],['Escreva as fórmulas de período para seno/cosseno e tangente.','Construa uma tabela de cinco pontos para um período de sen x.','Compare o que amplitude, período e translação vertical alteram no gráfico.','Marque domínio, imagem, zeros e pontos em que a tangente não existe.'],['Usar π/|b| para seno/cosseno ou 2π/|b| para tangente.','Confundir amplitude com período.','Esquecer que o termo constante dentro do argumento pode deslocar a fase.'],['Qual é a imagem de 1+2cos x?','Como encontrar o primeiro zero positivo de cos(3x)?','Onde tg x não está definida?']);
study('triangulo-retangulo',[['Seno em triângulo retângulo?','Cateto oposto/hipotenusa.'],['Cosseno?','Cateto adjacente/hipotenusa.'],['Tangente?','Cateto oposto/cateto adjacente.'],['Relação de Pitágoras?','a²+b²=c², com c como hipotenusa.'],['O que muda ao trocar o ângulo agudo?','Os catetos oposto e adjacente trocam.'],['sen 30°?','1/2.']],['Desenhe triângulos e identifique hipotenusa e ângulo de referência.','Copie SOH-CAH-TOA por extenso: seno, cosseno e tangente.','Inclua Pitágoras e um triângulo 3–4–5 como referência.','Resolva um exemplo usando cada razão e um usando Pitágoras.'],['Chamar qualquer lado inclinado de hipotenusa; ela fica oposta a 90°.','Identificar oposto/adjacente sem fixar o ângulo θ.','Usar uma razão que não relaciona os lados informados.'],['Como escolher entre seno, cosseno e tangente?','O que ocorre com oposto e adjacente ao trocar θ?','Como verificar um lado desconhecido usando Pitágoras?']);
study('identidades',[['Identidade fundamental?','sen²x+cos²x=1.'],['Tangente em termos de seno e cosseno?','tg x=sen x/cos x, se cos x≠0.'],['1−sen²x equivale a?','cos²x.'],['1+tg²x equivale a?','1/cos²x, se cos x≠0.'],['O quadrante altera o sinal?','Sim; use o sinal compatível com o quadrante.'],['Pode cancelar parcelas?','Não; somente fatores comuns não nulos.']],['Derive sen²x+cos²x=1 a partir de Pitágoras.','Copie as restrições de domínio ligadas a denominadores nulos.','Pratique substituir identidades antes de fatorar expressões.','Mostre por escrito quando o quadrante escolhe o sinal positivo ou negativo.'],['Usar a raiz positiva sem verificar o quadrante.','Cancelar termos que são parcelas em vez de fatores.','Esquecer as condições necessárias para dividir por cos x.'],['Como simplificar (1−sen²x)/cos²x?','Por que a identidade não determina sozinha o sinal da raiz?','Qual restrição acompanha tg x=sen x/cos x?']);

study('aplicacoes-trig',[['Elevação medida da horizontal?','A altura é o cateto oposto; distância horizontal, adjacente.'],['Qual razão relaciona esses catetos?','Tangente.'],['Antes de calcular, o que desenhar?','Horizontal, vertical/altura e linha de visão.'],['Ângulo com a vertical: o que muda?','Identifique de novo oposto e adjacente no desenho.'],['Duas observações de alturas?','Use a altura comum em ambas as relações.'],['Conferência final?','Unidades consistentes e resultado plausível.']],['Desenhe e rotule um caso de ângulo de elevação.','Desenhe um caso em que o ângulo é medido a partir da vertical.','Monte as equações de duas observações da mesma altura.','Anote arredondamentos e unidades em cada etapa.'],['Confundir ângulo com a vertical e com a horizontal.','Misturar metros e quilômetros.','Aproximar cedo demais ou esquecer a altura do observador.'],['Quais lados formam tg em uma situação de elevação?','Como organizar equações de dois pontos de observação?','Como avaliar se o resultado numérico é plausível?']);
study('paralelogramos-retangulos',[['Lados opostos?','Paralelos e congruentes.'],['Ângulos opostos?','Congruentes.'],['Ângulos consecutivos?','Suplementares.'],['Diagonais?','Bissetam-se.'],['O que diagonais que se bissetam provam?','O quadrilátero é um paralelogramo.'],['Isso prova que é retângulo?','Não.']],['Desenhe um paralelogramo e marque pares de lados e ângulos.','Mostre por que ângulos consecutivos somam 180°.','Desenhe diagonais e marque as metades iguais.','Resolva uma equação de ângulos e uma de segmentos.'],['Bissetar diagonais não significa que elas têm o mesmo comprimento.','Bissetar diagonais não prova que o paralelogramo é retângulo.','Não confunda ângulos opostos com consecutivos.'],['Que propriedade permite achar a metade de uma diagonal?','Se um ângulo mede 68°, quanto mede o consecutivo?','Qual critério envolvendo diagonais garante paralelogramo?']);

study('losangos',[['Lados do losango?','Quatro lados congruentes.'],['Diagonais?','Perpendiculares e se bissetam.'],['Área?','A=Dd/2.'],['Perímetro?','P=4l.'],['Como achar o lado pelas diagonais?','Pitágoras com as metades D/2 e d/2.'],['Ângulos consecutivos?','Suplementares.']],['Desenhe as diagonais perpendiculares e marque suas metades.','Copie A=Dd/2 e P=4l.','Derive o lado por Pitágoras usando as semidiagonais.','Resolva um caso de área e outro de perímetro.'],['Usar a diagonal inteira em Pitágoras em vez da metade.','Confundir altura com diagonal.','Não dividir o produto das diagonais por dois na área.'],['Como calcular o lado se as diagonais são 10 e 24?','Como achar uma diagonal com área e outra diagonal?','Por que diagonais perpendiculares formam triângulos retângulos?']);
study('trapezios',[['Bases?','O par de lados paralelos.'],['Altura?','Distância perpendicular entre as bases.'],['Área?','A=(B+b)h/2.'],['Ângulos junto à mesma lateral?','Suplementares.'],['Trapézio isósceles?','Lados não paralelos congruentes.'],['Como obter altura da área?','h=2A/(B+b).']],['Desenhe bases maior e menor e indique a altura perpendicular.','Copie a fórmula de área e isole h.','Marque ângulos suplementares em uma mesma lateral.','Resolva um exemplo com área e outro com dados inversos.'],['Altura não é o lado oblíquo.','Não somar as bases sem dividir por dois.','A definição de trapézio pode variar; confira a convenção usada em aula.'],['Qual altura resulta de área 84 e bases 18 e 10?','Por que os ângulos da mesma lateral são suplementares?','Como separar a altura no trapézio isósceles?']);
study('poligonos-angulos',[['Soma interna?','S=(n−2)·180°.'],['Triângulos formados de um vértice?','n−2.'],['Diagonais partindo de um vértice?','n−3.'],['Total de diagonais?','D=n(n−3)/2.'],['Soma dos ângulos externos?','360°.'],['Polígono convexo?','Não tem reentrâncias.']],['Derive S=(n−2)·180° por triangulação.','Copie as três relações de diagonais e ângulos.','Resolva um exemplo direto e um problema inverso para n.','Compare polígono convexo e côncavo com desenhos.'],['O número de diagonais total conta cada segmento duas vezes antes de dividir por 2.','Não use n−2 para diagonais que saem de um vértice.','Em regular, divida a soma interna por n para obter cada ângulo.'],['Como achar n a partir da soma interna?','Por que a fórmula total de diagonais tem divisão por 2?','Qual diferença entre ângulo interno e externo?']);
study('regulares-apotema',[['Polígono regular?','Lados e ângulos congruentes.'],['Apótema?','Distância perpendicular do centro ao lado.'],['Área com perímetro e apótema?','A=Pa/2.'],['Cada ângulo externo de um regular?','360°/n.'],['Raio da circunferência inscrita?','É igual ao apótema.'],['Círculo inscrito em quadrado?','Diâmetro igual ao lado do quadrado.']],['Desenhe um regular dividido em triângulos pelo centro e destaque o apótema.','Derive A=Pa/2 somando áreas dos triângulos.','Compare o apótema (centro até lado) com a distância do centro ao vértice.','Resolva uma área de polígono e uma questão de círculo inscrito.'],['O apótema é perpendicular ao lado, não até um vértice.','Não confunda o apótema com a distância do centro ao vértice.','Use apenas a relação da circunferência inscrita apresentada neste módulo.'],['Como calcular área com perímetro 60 e apótema 4?','Que relação há entre apótema e raio inscrito?','Como obter o lado do quadrado a partir do comprimento do círculo inscrito?']);

{id:'semelhanca-tales',name:'Semelhança de triângulos e Teorema de Tales',goal:'Reconhecer triângulos semelhantes, estabelecer correspondência entre lados e aplicar proporcionalidade em retas paralelas e pontos médios.',summary:['Triângulos com dois ângulos correspondentes iguais são semelhantes (critério AA).','Lados correspondentes de triângulos semelhantes são proporcionais; perímetros variam na mesma razão.','Uma reta paralela a um lado que passa pelo ponto médio de outro lado divide o terceiro lado ao meio.','O segmento que une os pontos médios de dois lados mede metade do terceiro lado.'],theory:[{title:'Semelhança e correspondência',text:'Triângulos semelhantes têm ângulos correspondentes iguais e lados correspondentes proporcionais. Pelo critério AA, basta verificar dois pares de ângulos iguais. Antes de montar a proporção, identifique a ordem dos vértices e associe os lados opostos aos mesmos ângulos.',example:'Se a razão entre lados do menor e do maior é 2/3, um lado de 10 cm no menor corresponde a 15 cm no maior.'},{title:'Paralelas, Tales e ponto médio',text:'Retas paralelas que cortam transversais produzem segmentos correspondentes proporcionais. No triângulo, uma paralela a um lado forma um triângulo menor semelhante ao original. Se passa pelo ponto médio de um lado, também atinge o ponto médio do outro; o segmento entre os pontos médios mede metade do lado paralelo.',example:'Se M é ponto médio de AB e MN é paralela a BC, N é ponto médio de AC e MN=BC/2.'},{title:'Perímetros e áreas',text:'Em triângulos semelhantes, perímetros estão na razão dos lados correspondentes. As áreas estão na razão do quadrado dessa razão linear.',example:'Razão linear 2:3 implica razão de perímetros 2:3 e razão de áreas 4:9.'}],cards:[['Critério AA?','Dois pares de ângulos correspondentes iguais.'],['Como relacionar lados semelhantes?','Monte proporções com lados correspondentes.'],['Razão linear 2:3: razão dos perímetros?','2:3.'],['Razão linear 2:3: razão das áreas?','4:9.'],['Reta pelo ponto médio paralela ao terceiro lado?','Encontra o ponto médio do outro lado.'],['Segmento médio do triângulo?','Paralelo ao terceiro lado e mede sua metade.']],notebook:['Desenhe dois triângulos semelhantes e marque os pares de ângulos e lados correspondentes.','Copie os critérios AA e as relações de lados e perímetros.','Registre o teorema do ponto médio e a relação do segmento médio.','Resolva uma proporção identificando a correspondência antes de substituir valores.'],traps:['Não associe lados apenas pela posição no desenho; use os ângulos correspondentes.','A razão entre áreas é o quadrado da razão entre lados.','A conclusão do ponto médio exige o paralelismo indicado.'],studyQuestions:['Como justificar semelhança usando dois ângulos?','Como escolher a correspondência correta de lados?','Por que o segmento médio mede metade do terceiro lado?'],quiz:[{difficulty:'Fixação',concept:'Critério AA',q:'Dois triângulos têm dois pares de ângulos correspondentes iguais. O que se pode concluir?',options:['São semelhantes pelo critério AA','São congruentes em qualquer caso','Têm a mesma área','São equiláteros'],answer:0,explanation:'Dois pares de ângulos iguais bastam para estabelecer semelhança AA.'},{difficulty:'Aplicação',concept:'Proporção de lados',q:'A razão entre lados correspondentes do menor e do maior triângulo é 2:3. Um lado do menor mede 8 cm. Quanto mede o correspondente no maior?',options:['12 cm','10 cm','6 cm','16 cm'],answer:0,explanation:'8/ x=2/3, então x=12 cm.'},{difficulty:'Análise',concept:'Teorema do ponto médio',q:'M é ponto médio de AB e MN é paralela a BC. Onde fica N?',options:['No ponto médio de AC','No vértice A','No ponto médio de BC','Não é possível concluir'],answer:0,explanation:'A paralela pelo ponto médio de um lado encontra o outro lado no seu ponto médio.'},{difficulty:'Nível prova',concept:'Segmento médio',q:'Em um triângulo, M e N são pontos médios de dois lados. Se o terceiro lado mede 26 cm, quanto mede MN?',options:['13 cm','26 cm','52 cm','6,5 cm'],answer:0,explanation:'O segmento médio mede metade do terceiro lado: 26/2=13 cm.'}],exercises:[makeExercise('A razão entre lados correspondentes do menor e do maior triângulo é 3:5. Se o lado do menor mede 12 cm, quanto mede o correspondente no maior?','20 cm','Use 12/x=3/5.','3x=60; x=20 cm.','Fixação'),makeExercise('Os perímetros de dois triângulos semelhantes estão na razão 4:7. O menor tem perímetro 36 cm. Determine o maior.','63 cm','Perímetros seguem a mesma razão linear.','36/x=4/7; x=63 cm.'),makeExercise('M é ponto médio de AB e MN é paralela a BC. Se AC=18 cm, quanto mede AN?','9 cm','Pelo teorema do ponto médio, N também é ponto médio de AC.','AN=AC/2=9 cm.'),makeExercise('Uma paralela divide dois lados de um triângulo. Em uma transversal, os segmentos medem 4 e 6; na outra, os correspondentes medem x e 9. Determine x.','6','Use 4/6=x/9.','6x=36; x=6.'),makeExercise('Dois triângulos equiláteros têm lados 5 cm e 12 cm. Qual é a razão entre seus perímetros, menor para maior?','5/12','Perímetros de figuras semelhantes seguem a razão dos lados.','A razão linear e de perímetros é 5:12.'),makeExercise('Dois triângulos semelhantes têm razão de lados 2:3. A área do menor é 24 cm². Qual é a área do maior?','54 cm²','A razão das áreas é o quadrado: 4:9.','24/x=4/9; x=54 cm².'),makeExercise('M e N são pontos médios de dois lados de um triângulo. Se MN=7,5 cm, quanto mede o terceiro lado?','15 cm','O segmento médio é metade do lado paralelo.','O lado mede 2·7,5=15 cm.'),makeExercise('No triângulo ABC, M é ponto médio de AB e MN é paralela a BC. Se BC=22 cm, determine MN.','11 cm','Use o teorema do segmento médio.','MN=BC/2=11 cm.','Nível prova')]},
{id:'graficos-trig-transformacoes',name:'Gráficos trigonométricos: leitura e transformações',goal:'Interpretar domínio, imagem, período, amplitude e deslocamentos em gráficos de seno, cosseno e tangente.',summary:['Em A·sen(bx+c)+d e A·cos(bx+c)+d, a amplitude é |A|, o período é 2π/|b| e a linha média é y=d.','A imagem vai de d−|A| a d+|A|. O termo c desloca a fase; o período depende de b.','Para tangente, o período é π/|b| e os pontos em que cos(bx+c)=0 ficam fora do domínio.','Em |sen x|, a imagem é [0,1] e o período fundamental é π.'],theory:[{title:'Amplitude, linha média e imagem',text:'Em y=A·sen(bx+c)+d ou y=A·cos(bx+c)+d, |A| determina a amplitude, d é a linha média e a imagem é [d−|A|,d+|A|]. O termo fora da função desloca o gráfico verticalmente; não altera o período.',example:'f(x)=1+3sen x tem amplitude 3, linha média y=1 e imagem [−2,4].'},{title:'Período e fase',text:'Para seno e cosseno, T=2π/|b|. Reescreva bx+c como b(x+c/b) para identificar o deslocamento horizontal. Para tangente, T=π/|b|; exclua os valores que fazem o cosseno do argumento ser zero.',example:'cos(2x−π/2)=cos(2(x−π/4)): o período é π e o gráfico se desloca π/4 para a direita.'},{title:'Leitura de um período',text:'Marque o comprimento de um período no eixo x e divida-o em quatro partes para localizar os pontos principais de seno e cosseno. Para funções transformadas, aplique amplitude e linha média aos valores de referência.',example:'Em 2cos(3x), um período mede 2π/3 e a imagem é [−2,2].'}],cards:[['Amplitude de A·sen x?','|A|.'],['Período de cos(bx)?','2π/|b|.'],['Linha média de A·sen x+d?','y=d.'],['Imagem de d+A·sen x?','[d−|A|,d+|A|].'],['Período de tg(bx)?','π/|b|.'],['Período de |sen x|?','π.']],notebook:['Monte um quadro para amplitude, período, linha média e imagem.','Desenhe os cinco pontos principais de um período de seno e cosseno.','Pratique reescrever bx+c como b(x−h) para localizar o deslocamento.','Anote os valores excluídos do domínio da tangente.'],traps:['Amplitude não é o valor máximo quando há deslocamento vertical.','O termo c não altera o período, mas desloca horizontalmente o gráfico.','Tangente não está definida quando o cosseno do argumento é zero.'],studyQuestions:['Como obter a imagem de d+A·cos(bx+c)?','Como localizar a fase ao fatorar b no argumento?','Quais valores devem ser excluídos do domínio de uma tangente?'],quiz:[{difficulty:'Fixação',concept:'Imagem',q:'Qual é a imagem de f(x)=3+2sen x?',options:['[1,5]','[−2,2]','[3,5]','[1,3]'],answer:0,explanation:'A imagem de sen x é [−1,1]; multiplicar por 2 e somar 3 resulta em [1,5].'},{difficulty:'Aplicação',concept:'Período',q:'Qual é o período de cos(4x)?',options:['π/2','4π','π/4','2π'],answer:0,explanation:'T=2π/4=π/2.'},{difficulty:'Análise',concept:'Fase',q:'A função cos(2x−π/2) está deslocada horizontalmente quanto e para que lado em relação a cos(2x)?',options:['π/4 para a direita','π/2 para a direita','π/4 para a esquerda','π/2 para a esquerda'],answer:0,explanation:'2x−π/2=2(x−π/4), então desloca π/4 para a direita.'},{difficulty:'Nível prova',concept:'Domínio da tangente',q:'Qual conjunto deve ser excluído do domínio de tg(πx−π/2)?',options:['Todos os inteiros','Todos os naturais pares','Inteiros ímpares','Nenhum valor'],answer:0,explanation:'A tangente não existe se πx−π/2=π/2+kπ; daí x=1+k, qualquer inteiro.'}],exercises:[makeExercise('Determine amplitude, período, linha média e imagem de f(x)=2cos(4x)+1.','2; π/2; y=1; [−1,3]','Use |A|, 2π/|b| e d±|A|.','A=2, T=π/2, linha média 1 e imagem [−1,3].','Fixação'),makeExercise('Determine o período de |sen x|.','π','Compare o valor da função em x e x+π.','sen(x+π)=−sen x; tomando módulo, o gráfico repete em π.'),makeExercise('Encontre o primeiro zero positivo de cos(3x).','π/6','O primeiro zero de cos u ocorre quando u=π/2.','3x=π/2, logo x=π/6.'),makeExercise('Para g(x)=1+4sen(2x), determine a imagem e o período.','[−3,5]; π','A imagem é d±|A| e T=2π/|b|.','Imagem [1−4,1+4]=[−3,5]; T=2π/2=π.'),makeExercise('Reescreva sen(3x+3π/4) identificando o deslocamento horizontal.','3(x+π/4); π/4 para a esquerda','Coloque 3 em evidência no argumento.','3x+3π/4=3(x+π/4), deslocamento π/4 para a esquerda.'),makeExercise('Determine o período de tg(5x−π/3).','π/5','Use T=π/|b| para a tangente.','T=π/5.'),makeExercise('Para f(x)=3−2cos x, determine os valores mínimo e máximo.','1 e 5','cos x varia de −1 a 1.','f varia de 3−2=1 a 3+2=5.'),makeExercise('Em um período de sen x, quais são os cinco valores principais em x=0, π/2, π, 3π/2 e 2π?','0, 1, 0, −1, 0','Avalie o seno nos cinco pontos igualmente espaçados.','sen(0)=0; sen(π/2)=1; senπ=0; sen(3π/2)=−1; sen(2π)=0.','Nível prova')]},
{id:'quadrilateros-criterios',name:'Quadriláteros: critérios e demonstrações',goal:'Usar propriedades das diagonais, lados e ângulos para classificar quadriláteros e justificar conclusões.',summary:['Se as diagonais de um quadrilátero se bissetam, ele é um paralelogramo.','Em um paralelogramo, diagonais congruentes caracterizam um retângulo; diagonais perpendiculares caracterizam um losango.','Um quadrilátero com um par de lados opostos paralelos e congruentes é um paralelogramo.','Um quadrilátero tem soma dos ângulos internos igual a 360°.'],theory:[{title:'Critérios pelas diagonais',text:'Em um quadrilátero, diagonais que se bissetam mutuamente são critério suficiente para concluir que ele é paralelogramo. Em um paralelogramo, diagonais congruentes indicam retângulo; diagonais perpendiculares indicam losango. Justifique sempre em duas etapas: primeiro a classe geral, depois a propriedade adicional.',example:'Se as diagonais se bissetam e também são congruentes, o quadrilátero é paralelogramo e, por ter diagonais congruentes, é retângulo.'},{title:'Critérios pelos lados e ângulos',text:'Se um par de lados opostos de um quadrilátero é paralelo e congruente, o quadrilátero é paralelogramo. Ângulos opostos de um paralelogramo são congruentes e os consecutivos são suplementares. A soma interna de qualquer quadrilátero convexo é 360°.',example:'Se um ângulo de paralelogramo mede 124°, o oposto mede 124° e cada consecutivo mede 56°.'},{title:'Como redigir uma justificativa',text:'Identifique os dados fornecidos, cite o critério correspondente e só então conclua a classificação. Uma propriedade necessária não é automaticamente suficiente: por exemplo, diagonais que se bissetam garantem paralelogramo, mas não garantem retângulo.',example:'Dados: diagonais se bissetam. Critério: quadrilátero cujas diagonais se bissetam é paralelogramo. Conclusão: ABCD é paralelogramo.'}],cards:[['Diagonais se bissetam: que classe?','Paralelogramo.'],['Paralelogramo com diagonais congruentes?','Retângulo.'],['Paralelogramo com diagonais perpendiculares?','Losango.'],['Lados opostos paralelos e congruentes?','Critério para paralelogramo.'],['Soma angular do quadrilátero?','360°.'],['Bissetar diagonais prova retângulo?','Não, só prova paralelogramo.']],notebook:['Faça uma tabela de critérios para paralelogramo, retângulo e losango.','Copie os critérios das diagonais e dos lados opostos.','Escreva uma justificativa em dados, propriedade e conclusão.','Resolva questões distinguindo propriedade necessária e suficiente.'],traps:['Não concluir retângulo apenas porque as diagonais se bissetam.','Não concluir losango apenas por diagonais congruentes.','Separe a classificação geral da propriedade especial.'],studyQuestions:['Qual conclusão é garantida quando as diagonais se bissetam?','Que propriedade adicional das diagonais caracteriza retângulo em um paralelogramo?','Como estruturar uma demonstração geométrica curta?'],quiz:[{difficulty:'Fixação',concept:'Critério das diagonais',q:'As diagonais de um quadrilátero se cruzam em seus pontos médios. O que isso garante?',options:['Que o quadrilátero é um paralelogramo','Que é um retângulo','Que é um quadrado','Que as diagonais são perpendiculares'],answer:0,explanation:'Diagonais que se bissetam mutuamente caracterizam um paralelogramo.'},{difficulty:'Aplicação',concept:'Critério de retângulo',q:'Um paralelogramo tem diagonais congruentes. Qual classe adicional está garantida?',options:['Retângulo','Trapézio isósceles','Losango','Deltoide'],answer:0,explanation:'Paralelogramo com diagonais congruentes é retângulo.'},{difficulty:'Análise',concept:'Critério de losango',q:'Em um paralelogramo, as diagonais são perpendiculares. Qual classe adicional está garantida?',options:['Losango','Retângulo','Trapézio','Pentágono'],answer:0,explanation:'Diagonais perpendiculares em paralelogramo caracterizam losango.'},{difficulty:'Nível prova',concept:'Critério pelos lados',q:'Um quadrilátero tem um par de lados opostos paralelos function normalizeAnswer(s){let raw=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();if(/quadrant/.test(raw)){if(/(quarto|fourth|\biv\b|\b4\b|4o|4º)/.test(raw))return'4';if(/(terceiro|third|\biii\b|\b3\b|3o|3º)/.test(raw))return'3';if(/(segundo|second|\bii\b|\b2\b|2o|2º)/.test(raw))return'2';if(/(primeiro|first|\bi\b|\b1\b|1o|1º)/.test(raw))return'1';}return raw.replace(/°/g,'').replace(/\s+/g,'').replace(/,/g,'.').replace(/cm²|cm2|m²|m2|km²|km2|cm|km|m|graus|grau|rad$/g,'').replace(/[−–]/g,'-').replace(/quadrante|quadrant/g,'');}
