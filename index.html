{id:'poligonos',name:'Polígonos e circunferência',goal:'Classificar polígonos, calcular ângulos e diagonais e aplicar relações de círculos e polígonos regulares.',theory:'Polígono é uma linha poligonal fechada e simples. Em um convexo de n lados: soma interna S=(n−2)·180°; no regular, cada ângulo interno α=180°(n−2)/n e cada externo β=360°/n. O número de diagonais é D=n(n−3)/2. Circunferência é o contorno; círculo inclui a região interna. C=2πR e A=πR². Em regular, A=P·a/2 e R²=a²+(ℓ/2)². Inscrito: vértices na circunferência; circunscrito: lados tangentes. Pegadinha: ângulo externo usado na soma é um por vértice.',notes:'Caderno: (1) desenhe convexo e côncavo; (2) derive S por triangulação; (3) registre α, β e D; (4) quadro círculo/circunferência; (5) faça um esquema inscrito × circunscrito. Perguntas: por que aparecem n−2 triângulos? Quando uso apótema? O que determina n a partir de β?',cards:[['Qual é a soma dos ângulos internos de um convexo?','(n−2)·180°.'],['Quantas diagonais tem um n-gono?','n(n−3)/2.'],['Qual o ângulo externo de um regular?','360°/n.'],['Como calcular a área de círculo?','πR².'],['Como distinguir inscrito de circunscrito?','Inscrito tem vértices na circunferência; circunscrito tem lados tangentes.']],questions:[['Fixação','Um hexágono convexo tem soma interna de quanto?',['540°','720°','900°','360°'],0,'S=(6−2)·180°=720°.'],['Fixação','Quantas diagonais tem um octógono?',['16','20','24','28'],1,'D=8·5/2=20.'],['Fixação','Ângulo externo de um decágono regular:',['30°','36°','144°','18°'],1,'360°/10=36°.'],['Aplicação','Um regular tem ângulo externo 24°. Quantos lados?',['12','15','18','24'],1,'n=360/24=15.'],['Aplicação','Raio 4 cm. Área do círculo:',['8π','16π','4π','32π'],1,'A=π·4²=16π cm².'],['Aplicação','Regular de perímetro 30 e apótema 4. Área:',['60','120','34','240'],0,'A=P·a/2=60.'],['Análise','Qual afirmação diferencia círculo e circunferência?',['São sinônimos','Circunferência é contorno; círculo inclui interior','Círculo é só o contorno','Circunferência tem área'],1,'Definições geométricas do material.'],['Análise','A triangulação de um convexo a partir de um vértice produz:',['n triângulos','n−1','n−2','n−3'],2,'As diagonais do vértice dividem em n−2 triângulos.'],['Análise','Se β=30° num polígono regular, então α é:',['150°','120°','30°','330°'],0,'Ângulos adjacentes são suplementares.'],['Nível prova','Um polígono regular tem 90 diagonais. Qual n?',['12','15','18','20'],1,'n(n−3)/2=90; n²−3n−180=0; n=15.'],['Nível prova','Hexágono regular inscrito em círculo de raio 6. O lado mede:',['3','6','6√3','12'],1,'Os triângulos centrais são equiláteros, então ℓ=R.'],['Nível prova','Um dodecágono regular tem ângulo interno:',['120°','135°','150°','165°'],2,'α=180°(12−2)/12=150°.']]},
{id:'quadrilateros',name:'Quadriláteros notáveis',goal:'Reconhecer classes de quadriláteros e usar propriedades de ângulos, lados, diagonais, perímetros e áreas.',theory:'Todo quadrilátero tem soma dos ângulos internos 360°. Paralelogramo: lados opostos paralelos e iguais; ângulos opostos iguais, consecutivos suplementares; diagonais se cortam ao meio. Retângulo: quatro ângulos retos e diagonais iguais. Losango: quatro lados iguais, diagonais perpendiculares que se bissetam; A=Dd/2. Quadrado reúne propriedades de retângulo e losango. Trapézio tem um par de lados paralelos; A=(B+b)h/2. Pegadinha: diagonais perpendiculares ou diagonais que se bissetam, isoladamente, não garantem quadrado/retângulo.',notes:'Caderno: desenhe árvore de inclusão quadrado→retângulo/losango→paralelogramo; anote propriedades das diagonais; fórmulas de área; trapézios isósceles/retângulos/escalenos. Perguntas: qual propriedade é suficiente? O que as diagonais fazem? Como diferenciar altura e lado oblíquo?',cards:[['Soma interna de quadrilátero?','360°.'],['O que ocorre com diagonais de paralelogramo?','Cortam-se ao meio.'],['Diagonal de retângulo?','Congruentes e se cortam ao meio.'],['Área do losango?','D·d/2.'],['Área do trapézio?','(B+b)h/2.']],questions:[['Fixação','A soma interna de qualquer quadrilátero é:',['180°','360°','540°','720°'],1,'Divide-se em dois triângulos.'],['Fixação','Num paralelogramo, ângulos consecutivos são:',['iguais','suplementares','complementares','sempre retos'],1,'Somam 180°.'],['Fixação','Área do losango de diagonais 8 e 6:',['24','48','14','28'],0,'A=8·6/2=24.'],['Aplicação','Trapézio com bases 10 e 6 e altura 4:',['32','64','40','16'],0,'A=(10+6)·4/2=32.'],['Aplicação','Paralelogramo base 9 e altura 5:',['45','28','90','14'],0,'A=bh=45.'],['Aplicação','Retângulo 5 por 12: diagonal mede:',['13','17','60','7'],0,'Pitágoras: √(25+144)=13.'],['Análise','Qual figura tem diagonais sempre congruentes?',['Losango','Retângulo','Trapézio qualquer','Paralelogramo qualquer'],1,'Retângulos têm diagonais iguais.'],['Análise','Diagonais que se cortam ao meio indicam necessariamente:',['retângulo','losango','paralelogramo','quadrado'],2,'É critério de paralelogramo, sem garantir ângulos retos ou lados iguais.'],['Análise','Um losango com ângulos retos é também:',['trapézio escaleno','quadrado','retângulo apenas','pentágono'],1,'Lados iguais e quatro ângulos retos definem quadrado.'],['Nível prova','Ângulos consecutivos de um paralelogramo estão na razão 1:3. O menor mede:',['45°','60°','90°','135°'],1,'x+3x=180°, então x=45°.'],['Nível prova','Losango de perímetro 40 cm tem lado:',['5','10','20','40'],1,'Quatro lados iguais: 40/4=10.'],['Nível prova','Trapézio retângulo tem ângulos não retos α e 5α. α vale:',['15°','30°','45°','60°'],1,'Os outros dois somam 180°; 6α=180°, α=30°.']]},
{id:'triangulos',name:'Triângulos e relações métricas',goal:'Aplicar soma angular, congruência/semelhança e relações métricas em triângulos, inclusive os notáveis.',theory:'A soma dos ângulos internos de um triângulo é 180°. A desigualdade triangular exige que cada lado seja menor que a soma dos outros dois. Equilátero tem três lados iguais e ângulos de 60°; isósceles tem dois lados iguais e ângulos da base iguais. Em triângulo retângulo, a²+b²=c². Razão de semelhança k multiplica comprimentos por k e áreas por k². Linha média: segmento que une pontos médios de dois lados é paralelo ao terceiro e mede sua metade. Há questões nos anexos que misturam triângulos e quadriláteros; quando uma figura é essencial, confira o original.',notes:'Caderno: classificação por lados/ângulos; desigualdade triangular; Pitágoras; semelhança e escala; linha média. Perguntas: que informação prova semelhança? Como varia área sob escala? Por que a linha média mede metade?',cards:[['Soma dos ângulos internos?','180°.'],['Teorema de Pitágoras?','a²+b²=c² no triângulo retângulo.'],['Fator de escala k altera área por quanto?','Por k².'],['Linha média é paralela a quê?','Ao terceiro lado.'],['Ângulos da base de isósceles?','São congruentes.']],questions:[['Fixação','Soma dos ângulos de triângulo:',['90°','180°','270°','360°'],1,'Propriedade fundamental.'],['Fixação','Num triângulo retângulo 3-4-?, hipotenusa:',['5','6','7','4'],0,'3²+4²=25.'],['Fixação','Ângulo de cada vértice de equilátero:',['45°','60°','90°','120°'],1,'180°/3=60°.'],['Aplicação','Lados 5 e 7. Qual pode ser o terceiro?',['2','12','10','13'],2,'Deve ser maior que 2 e menor que 12.'],['Aplicação','Triângulos semelhantes em escala 3: lado 4 corresponde a:',['7','12','16','1'],1,'Multiplica por 3.'],['Aplicação','Linha média paralela a lado 14 mede:',['28','7','14','21'],1,'Metade do terceiro lado.'],['Análise','Se lados correspondentes estão proporcionais, triângulos são:',['congruentes sempre','semelhantes pelo caso LLL','retângulos','equiláteros'],1,'Proporção dos três lados determina semelhança.'],['Análise','Áreas de figuras semelhantes com razão linear 2 estão na razão:',['2','4','6','8'],1,'A razão de áreas é o quadrado da razão linear.'],['Análise','Dois triângulos equiláteros quaisquer são:',['congruentes','semelhantes','retângulos','isósceles não'],1,'Todos têm ângulos 60°.'],['Nível prova','Catetos de triângulo retângulo medem 8 e 15. Hipotenusa:',['17','23','√161','15'],0,'√(64+225)=17.'],['Nível prova','Perímetro de equilátero é 27. Área:',['81√3/4','27√3','9√3','27'],0,'Lado 9; área ℓ²√3/4.'],['Nível prova','Uma reta paralela a um lado passa pelo ponto médio de outro. No terceiro lado, atinge:',['ponto médio','extremo','terço','não se pode concluir'],0,'Teorema da linha média/conversa, conforme configuração triangular.']]},
{id:'trig-retangulo',name:'Trigonometria no triângulo retângulo',goal:'Resolver triângulos retângulos usando seno, cosseno e tangente, interpretando ângulos de elevação e inclinação.',theory:'Para ângulo agudo θ: senθ=cateto oposto/hipotenusa; cosθ=cateto adjacente/hipotenusa; tgθ=oposto/adjacente=senθ/cosθ. Valores notáveis: 30° (1/2, √3/2, √3/3), 45° (√2/2, √2/2, 1), 60° (√3/2, 1/2, √3). A hipotenusa é oposta ao ângulo reto. Em situações reais, desenhe o triângulo, identifique a razão que contém os dados pedidos e confira unidades. Problemas com imagem podem ocultar alinhamentos e medidas:  Verificar no material.',notes:'Caderno: tabela SOH-CAH-TOA; triângulos 30-60-90 e 45-45-90; esboço com ângulo de elevação; sequência dado→razão→equação→unidade. Perguntas: qual cateto é oposto? Quando usar tg? Como validar a magnitude?',cards:[['Definição do seno?','Oposto/hipotenusa.'],['Definição do cosseno?','Adjacente/hipotenusa.'],['Definição da tangente?','Oposto/adjacente.'],['sen 30°?','1/2.'],['tg 45°?','1.']],questions:[['Fixação','sen θ corresponde a:',['adj/hip','op/hip','op/adj','hip/op'],1,'Definição.'],['Fixação','cos θ corresponde a:',['adj/hip','op/hip','op/adj','hip/adj'],0,'Definição.'],['Fixação','tg θ corresponde a:',['op/adj','adj/hip','hip/op','op/hip'],0,'Definição.'],['Aplicação','Escada de 6 m faz 30° com o solo. Altura alcançada:',['3 m','6 m','3√3 m','12 m'],0,'Altura é oposto: 6·sen30°=3.'],['Aplicação','Cateto adjacente 8 e ângulo 45°. Oposto:',['4','8','8√2','16'],1,'tg45°=op/8=1.'],['Aplicação','Balão visto a 1,8 km com elevação 60°. Altura (mesma horizontal):',['1,8√3 km','0,9 km','3,6 km','1,8 km'],0,'tg60°=h/1,8.'],['Análise','Conhece oposto e adjacente; escolha:',['seno','cosseno','tangente','Pitágoras apenas'],2,'tg relaciona diretamente os dois catetos.'],['Análise','Se ângulo é agudo e hipotenusa 10, cateto oposto não pode exceder:',['10','20','5','1'],0,'Em triângulo retângulo cateto < hipotenusa.'],['Análise','Ao inclinar uma rampa mais, mantendo seu comprimento, a altura:',['diminui','aumenta','não muda','fica igual ao comprimento'],1,'Componente vertical L·senθ aumenta para ângulos agudos.'],['Nível prova','Teleférico sobe de 108 m a 144 m. Inclinação 32°, sen=0,52. Comprimento aproximado:',['69,2 m','36 m','84 m','144 m'],0,'Desnível 36; L=36/0,52≈69,2.'],['Nível prova','Torre de 114 m inclinada 15° da vertical, tg15°≈0,26. Deslocamento horizontal:',['29,64 m','114 m','438 m','15 m'],0,'Deslocamento=114·tg15°.'],['Nível prova','Teodolito avança 160 m; visadas 30° e 60°. Sem altura do instrumento, altura relativa ao nível do aparelho:',['80√3 m','80 m','160 m','240 m'],0,'Se distância inicial x e altura h: h=x/√3=(x−160)√3, então x=240 e h=80√3.']]},
{id:'arcos',name:'Arcos, radianos e ciclo trigonométrico',goal:'Converter graus e radianos, localizar arcos no ciclo unitário e determinar sinais e valores notáveis.',theory:'Uma volta mede 360°=2π rad; portanto π rad=180°. Graus→radianos: multiplicar por π/180; radianos→graus: multiplicar por 180/π. Arcos côngruos diferem por múltiplos de 360° ou 2π. No ciclo unitário, P=(cosθ,senθ). Sinais: I (+,+), II (−,+), III (−,−), IV (+,−) para (cos,sen). Tangente=sen/cos quando cos≠0. Valores notáveis estão na tabela abaixo; tangente não definida em 90° e 270°.',notes:'Caderno: desenhe eixos/círculo, marque quadrantes e valores 0, π/2, π, 3π/2, 2π; tabela de 30/45/60; conversões e arcos côngruos. Perguntas: qual coordenada é o seno? Como achar o quadrante de arco negativo? Quando tg não existe?',cards:[['π rad equivalem a?','180°.'],['Coordenadas no ciclo?','(cosθ, senθ).'],['Seno no II quadrante?','Positivo.'],['Arcos côngruos diferem por?','Múltiplo inteiro de 2π (ou 360°).'],['Quando tg é indefinida?','Quando cosθ=0.']],questions:[['Fixação','π/3 rad em graus:',['30°','60°','90°','120°'],1,'π rad=180°, logo π/3=60°.'],['Fixação','150° em radianos:',['5π/6','3π/4','2π/3','5π/3'],0,'150π/180=5π/6.'],['Fixação','No ciclo, coordenada vertical de P é:',['cosθ','senθ','tgθ','1'],1,'Definição do ciclo unitário.'],['Aplicação','Arco côngruo a 45° entre 0° e 720° pode ser:',['405°','300°','225°','90°'],0,'45°+360°=405°.'],['Aplicação','7π/4 está no quadrante:',['I','II','III','IV'],3,'315° situa-se no IV.'],['Aplicação','cos 300°:',['1/2','−1/2','√3/2','−√3/2'],2,'Referência 60°, cosseno positivo no IV.'],['Análise','No III quadrante, sinais (sen,cos,tg):',['(+,+,+)','(+,-,-)','(-,-,+)','(-,+,-)'],2,'Seno e cosseno negativos; quociente positivo.'],['Análise','Por que tg(π/2) não existe?',['sen=0','cos=0 e há divisão por zero','ângulo é negativo','π/2 não é radiano'],1,'tg=sen/cos.'],['Análise','Ponto correspondente a π rad:',['(1,0)','(0,1)','(−1,0)','(0,−1)'],2,'Meia volta.'],['Nível prova','Calcule sen210°:',['1/2','−1/2','√3/2','−√3/2'],1,'210°=180°+30°, seno negativo.'],['Nível prova','tg135°:',['1','−1','√3','−√3'],1,'135°=180°−45°; tangente negativa.'],['Nível prova','Arcos côngruos a 30° têm forma:',['30°+360°k','30°+180°k','30°+90°k','30°·k'],0,'Uma volta completa é 360°.']]},
{id:'funcoes',name:'Funções trigonométricas',goal:'Interpretar seno, cosseno e tangente como funções periódicas e identificar domínio, imagem e período em casos básicos.',theory:'f(x)=sen x e g(x)=cos x têm domínio ℝ, imagem [−1,1] e período 2π. Para sen(kx) ou cos(kx), período fundamental 2π/|k|, com k≠0. |sen x| tem imagem [0,1] e período π. a·sen x tem imagem [−|a|,|a|]. Tangente tem período π e não está definida onde cos x=0. Em a·sen(bx+c)+d: amplitude |a|, período 2π/|b| e deslocamento vertical d. Os anexos contêm exercícios com expressões ilegíveis/incompletas:  Verificar no material antes de confiar em respostas desses itens.',notes:'Caderno: tabela de um período; desenhe senoide/cossenoide; registre domínio, imagem e período; compare efeito de amplitude, frequência e deslocamento. Perguntas: como muda o período ao dobrar b? Qual transformação muda imagem? Qual o período de |sen x|?',cards:[['Período de sen x?','2π.'],['Imagem de cos x?','[−1,1].'],['Período de sen(3x)?','2π/3.'],['Imagem de 2sen x?','[−2,2].'],['Período de |sen x|?','π.']],questions:[['Fixação','Período de sen x:',['π','2π','1','π/2'],1,'Uma volta completa.'],['Fixação','Imagem de cos x:',['[0,1]','[−1,1]','ℝ','[−2,2]'],1,'Cosseno varia entre −1 e 1.'],['Fixação','Domínio de sen x:',['ℝ','[−1,1]','x≠0','[0,2π]'],0,'Definida para todo real.'],['Aplicação','Período de sen(7x):',['2π','2π/7','7π','π/7'],1,'T=2π/|7|.'],['Aplicação','Imagem de 2sen x:',['[−1,1]','[0,2]','[−2,2]','ℝ'],2,'Amplitude 2.'],['Aplicação','Período de cos(3x+1):',['2π/3','2π','π/3','3π'],0,'Deslocamento horizontal não altera período.'],['Análise','|sen x| tem período π porque:',['é sempre crescente','o módulo repete os arcos negativos sobre os positivos','tem amplitude 2','domínio é limitado'],1,'O padrão se repete a cada meia volta.'],['Análise','Em 4tg(2x), o período é:',['π','π/2','2π','4π'],1,'Tangente: π/|b|.'],['Análise','Qual alteração muda a imagem, sem mudar o período?',['multiplicar por amplitude','mudar fase','somar fase','trocar x por x+1'],0,'Amplitude altera valores verticais; período depende do coeficiente de x.'],['Nível prova','Para f(x)=−3sen(2x)+1, amplitude e período:',['3 e π','−3 e 2π','1 e π','3 e 4π'],0,'Amplitude é |−3|=3; T=2π/2=π.'],['Nível prova','Domínio de tg x exclui:',['kπ','π/2+kπ','2kπ','π/4+kπ'],1,'Cos x=0 nesses pontos.'],['Nível prova','f(x)=|sen x| tem imagem e período:',['[−1,1],2π','[0,1],π','[0,1],2π','[−1,1],π'],1,'Valor absoluto não negativo e repete a cada π.']]}
]};
const levels=['Fixação','Aplicação','Análise','Nível prova'];let state=JSON.parse(localStorage.getItem('gt-state')||'{"done":{},"answers":{},"correct":0,"total":0,"minutes":25}');let view='home',topic=DATA.topics[0];const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('gt-state',JSON.stringify(state))}function prog(){let n=DATA.topics.reduce((a,t)=>a+(state.done[t.id]?1:0),0);return Math.round(n/DATA.topics.length*100)}function nav(){ $('#nav').innerHTML='<button class="'+(view==='home'?'active':'')+'" onclick="home()"> Início</button>'+DATA.topics.map(t=>`<button class="${view==='topic'&&topic.id===t.id?'active':''}" onclick="openTopic('${t.id}')">${state.done[t.id]?' ':''}${esc(t.name)}</button>`).join('')+'<button onclick="special(\'quiz\')"> Quiz rápido</button><button onclick="special(\'sim\')"> Simulado</button><button onclick="special(\'stats\')"> Estatísticas</button><button onclick="special(\'timer\')"> Pomodoro</button>'}function home(){view='home';nav();const next=DATA.topics.find(t=>!state.done[t.id])||DATA.topics[0];$('#app').innerHTML=`<span class="pill">Plano adaptativo</span><h1>Estude com estratégia</h1><p>Uma trilha progressiva com teoria, anotações, revisão ativa e questões em quatro níveis.</p><div class="card"><strong>Antes de começar</strong><p>Quanto tempo você tem por dia?</p><div class="row"><select id="mins"><option value="15">15 minutos</option><option value="25">25 minutos</option><option value="45">45 minutos</option><option value="60">60 minutos</option></select><button onclick="startPlan()">Montar meu plano</button></div><p class="muted">O plano prioriza tópicos ainda não concluídos. Seu progresso fica salvo neste dispositivo.</p></div><h2>Sua trilha</h2><p>${prog()}% concluída</p><div class="bar"><i style="width:${prog()}%"></i></div><div class="grid">${DATA.topics.map((t,i)=>`<div class="card"><span class="pill">Etapa ${i+1}</span><h3>${esc(t.name)}</h3><p class="muted">${state.done[t.id]?'Concluído':'Pendente'} · 5 flashcards · 12 questões</p><button onclick="openTopic('${t.id}')">${state.done[t.id]?'Revisar':'Começar'}</button></div>`).join('')}</div><h2>Retomar</h2><button onclick="openTopic('${next.id}')">${esc(next.name)}</button>`}function startPlan(){state.minutes=+$('#mins').value;save();const ts=DATA.topics.filter(t=>!state.done[t.id]);view='home';home();$('#app').insertAdjacentHTML('afterbegin',`<div class="note"><b>Plano de hoje (${state.minutes} min)</b><br>${ts.slice(0,3).map((t,i)=>`${i+1}. ${esc(t.name)} — ${Math.max(5,Math.floor(state.minutes/ts.length))} min`).join('<br>')}<br>Feche com um quiz rápido para ajustar a próxima sessão.</div>`)}function openTopic(id){topic=DATA.topics.find(t=>t.id===id);view='topic';nav();renderTopic()}function renderTopic(){let qs=topic.questions;$('#app').innerHTML=`<span class="pill">${topic.questions.length} questões · 4 níveis</span><h1>${esc(topic.name)}</h1><h2>Objetivo</h2><p>${esc(topic.goal)}</p><button onclick="document.getElementById('topic-quiz').scrollIntoView({behavior:'smooth'})">Começar com quiz do módulo</button><h2>Teoria resumida</h2><p>${esc(topic.theory)}</p><h2>Roteiro para o caderno</h2><pre>${esc(topic.notes)}</pre><h2>Flashcards</h2><p class="muted">Tente responder antes de revelar.</p><div class="grid">${topic.cards.map((c,i)=>`<div class="card"><b>Cartão ${i+1}</b><p>${esc(c[0])}</p><button class="secondary" onclick="this.nextElementSibling.hidden=false">Revelar</button><p hidden>${esc(c[1])}</p></div>`).join('')}</div><h2 id="topic-quiz">Quiz e questões graduais</h2>${levels.map(level=>`<h3>${level}</h3>${qs.filter(q=>q[0]===level).map((q,i)=>questionHtml(q,topic.id+'-'+level+i)).join('')}`).join('')}<button onclick="markDone()">Marcar tópico como concluído </button>`}function questionHtml(q,id){let key=state.answers[id],opts=q[2].map((o,i)=>`<label class="option"><input type="radio" name="${id}" value="${i}" ${key!==undefined&&+key===i?'checked':''} onchange="answer('${id}',${i},${q[3]})"> ${esc(o)}</label>`).join('');return `<div class="question"><b>${esc(q[1])}</b>${opts}<div id="fb-${id}" class="feedback ${key!==undefined?(+key===q[3]?'good':'wrong'):''}">${key!==undefined?(+key===q[3]?'Correto. ':'Revise. ')+esc(q[4]):''}</div></div>`}function answer(id,val,correct){state.answers[id]=val;state.total++;if(val===correct)state.correct++;save();const f=$('#fb-'+id);f.className='feedback '+(val===correct?'good':'wrong');f.textContent=(val===correct?'Correto. ':'Ainda não. ')+topic.questions.find(q=>id.includes(topic.id)&&q[1]&&q[4])?.[4];if(view==='topic')renderTopic()}function markDone(){state.done[topic.id]=true;save();openTopic(topic.id)}function special(kind){view=kind;nav();if(kind==='stats'){$('#app').innerHTML=`<h1>Seu progresso</h1><div class="grid"><div class="card"><b>${prog()}%</b><p>da trilha concluída</p></div><div class="card"><b>${state.correct}</b><p>respostas corretas registradas</p></div><div class="card"><b>${state.total}</b><p>respostas tentadas</p></div><div class="card"><b>${state.total?Math.round(state.correct/state.total*100):0}%</b><p>taxa de acerto</p></div></div><h2>Por tópico</h2>${DATA.topics.map(t=>`<p>${esc(t.name)} · ${state.done[t.id]?'Concluído':'Em andamento'}</p>`).join('')}<button class="secondary" onclick="if(confirm('Apagar todo o progresso salvo?')){localStorage.removeItem('gt-state');location.reload()}">Apagar progresso</button>`;return}if(kind==='timer'){$('#app').innerHTML=`<h1>Pomodoro</h1><p>Escolha uma sessão focada de estudo.</p><div class="row"><select id="duration"><option value="25">25 min foco</option><option value="15">15 min foco</option><option value="5">5 min pausa</option></select><button onclick="runTimer()">Iniciar</button><button class="secondary" onclick="stopTimer()">Parar</button></div><div class="timer" id="clock">25:00</div><p id="timerMsg" aria-live="polite">Use uma pausa curta entre blocos.</p>`;return}let pool=DATA.topics.flatMap(t=>t.questions.map((q,i)=>({...q,id:t.id+'q'+i,topic:t.name})));pool.sort(()=>Math.random()-.5);pool=pool.slice(0,kind==='sim'?20:5);$('#app').innerHTML=`<h1>${kind==='sim'?'Simulado':'Quiz rápido'}</h1><p>${pool.length} questões variadas, embaralhadas. O gabarito aparece após responder.</p>${pool.map(q=>`<div class="question"><span class="pill">${esc(q.topic)} · ${esc(q[0])}</span><p><b>${esc(q[1])}</b></p>${q[2].map((o,i)=>`<label class="option"><input type="radio" name="s${q.id}" onchange="document.getElementById('sf${q.id}').innerHTML='${i===q[3]?'Correto!':'Resposta: '+esc(q[2][q[3]]).replaceAll("'","&#39;")+'.'} '+ '${esc(q[4]).replaceAll("'","&#39;")}';document.getElementById('sf${q.id}').className='feedback ${i===q[3]?'good':'wrong'}'"> ${esc(o)}</label>`).join('')}<div class="feedback" id="sf${q.id}"></div></div>`).join('')}`}function runTimer(){stopTimer();let left=+$('#duration').value*60;$('#clock').textContent=fmt(left);window._timer=setInterval(()=>{left--;$('#clock').textContent=fmt(left);if(left<=0){stopTimer();$('#timerMsg').textContent='Bloco encerrado. Respire e registre o que aprendeu.';if('Notification'in window&&Notification.permission==='granted')new Notification('Pomodoro concluído!')}},1000);if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}function stopTimer(){clearInterval(window._timer)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#font').onclick=()=>document.body.classList.toggle('large');nav();home();
</script><script>

function authScreen(tab='signup'){page='auth';nav();const signup=tab==='signup';$('#app').innerHTML=`<div class="account"><span class="pill">Sua aventura começa aqui</span><h1>${signup?'Crie sua conta':'Bem-vindo de volta'}</h1><p class="muted">Organize seus estudos e avance etapa por etapa.</p>${signup?'<label class="field">Seu nome<input id="name" autocomplete="name" placeholder="Como podemos chamar você?"></label>':''}<label class="field">E-mail<input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com"></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password" placeholder="Pelo menos 4 caracteres"></label><button style="width:100%" onclick="submitAuth('${tab}')">${signup?'Criar conta':'Entrar'}</button><p>${signup?'Já tem conta?':'Ainda não tem conta?'} <a href="#" onclick="event.preventDefault();authScreen('${signup?'login':'signup'}')">${signup?'Fazer login':'Criar conta'}</a></p><p class="muted" style="font-size:.85em">Demonstração: os dados ficam somente neste navegador e não são enviados a um servidor.</p></div>`}

function modulePrompt(id){pendingTopic=DATA.topics.find(t=>t.id===id);if(!pendingTopic)return;const idx=activeTopics().findIndex(t=>t.id===id)+1,back=document.createElement('div');back.className='modalback';back.id='moduleModal';back.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modtitle"><span class="pill">Módulo ${idx}</span><h2 id="modtitle">${esc(pendingTopic.name)}</h2><p>${esc(pendingTopic.goal)}</p><p class="muted">Aula resumida · flashcards · questões por nível</p><div class="row"><button onclick="closeModule();openTopic('${id}')">▶ Iniciar módulo</button><button class="secondary" onclick="closeModule()">Agora não</button></div></section>`;document.body.appendChild(back);back.addEventListener('click',e=>{if(e.target===back)closeModule()})}

abel class="field">Nome<input id="profileName" value="${esc(account?.name||'')}"></label><label class="field">E-mail<input value="${esc(account?.email||'')}" disabled></label><button onclick="account.name=document.getElementById('profileName').value.trim()||account.name;localStorage.setItem('gt-account',JSON.stringify(account));alert('Perfil atualizado');dashboard()">Salvar perfil</button><button class="secondary" onclick="onboarding()">Alterar conteúdos</button></div>`;return}if(kind==='timer'){window._timer&&clearInterval(window._timer);$('#app').innerHTML=`<h1>Pomodoro </h1><p>Escolha um bloco de foco para estudar sem distrações.</p><div class="row"><select id="duration"><option value="25">25 min foco</option><option value="15">15 min foco</option><option value="5">5 min pausa</option></select><button onclick="runTimer()">Iniciar</button><button class="secondary" onclick="stopTimer()">Parar</button></div><div class="timer" id="clock">25:00</div><p id="timerMsg" aria-live="polite">Ao terminar, faça uma pausa breve.</p>`;return}let pool=activeTopics().flatMap(t=>t.questions.map((q,i)=>({...q,id:t.id+'q'+i,topic:t.name}))).sort(()=>Math.random()-.5).slice(0,kind==='sim'?20:5);$('#app').innerHTML=`<h1>${kind==='sim'?'Simulado':'Quiz rápido'} </h1><p>${pool.length} questões variadas.</p>${pool.map(q=>`<div class="question"><span class="pill">${esc(q.topic)} · ${esc(q[0])}</span><p><b>${esc(q[1])}</b></p>${q[2].map((o,i)=>`<label class="option"><input type="radio" name="s${q.id}" onchange="document.getElementById('sf${q.id}').textContent='${i===q[3]?'Correto!':'Resposta: '+esc(q[2][q[3]]).replaceAll("'","&#39;")+'. '+esc(q[4]).replaceAll("'","&#39;")}';document.getElementById('sf${q.id}').className='feedback ${i===q[3]?'good':'wrong'}'"> ${esc(o)}</label>`).join('')}<div class="feedback" id="sf${q.id}"></div></div>`).join('')}`}

 {id:'quadrilateros',name:'Quadriláteros',goal:'Classificar quadriláteros notáveis e aplicar propriedades dos lados, ângulos, diagonais e áreas.',summary:['A soma dos ângulos internos de qualquer quadrilátero é 360°.','Paralelogramo: lados opostos paralelos e congruentes; ângulos opostos iguais; diagonais se cortam ao meio.','Retângulo: quatro ângulos retos; diagonais congruentes e se cortam ao meio.','Losango: quatro lados congruentes; diagonais perpendiculares e que se cortam ao meio.','Quadrado combina as propriedades de retângulo e losango.','Trapézio: um par de lados paralelos; A=(B+b)·h/2. Losango: A=D·d/2.'],cards:[['Soma dos ângulos internos?','360°.'],['O que as diagonais de um paralelogramo fazem?','Cortam-se ao meio.'],['Área do trapézio?','(B+b)·h/2.'],['Área do losango?','D·d/2.'],['Como reconhecer um quadrado pelas propriedades?','Quatro lados iguais e quatro ângulos retos.']],quiz:[
  {q:'A soma dos ângulos internos de um quadrilátero é:',options:['180°','270°','360°','540°'],answer:2,concept:'Ângulos de quadriláteros',explanation:'A diagonal divide o quadrilátero em dois triângulos: 2·180°=360°.'},
  {q:'Num paralelogramo, ângulos consecutivos são:',options:['iguais sempre','suplementares','complementares','sempre retos'],answer:1,concept:'Ângulos do paralelogramo',explanation:'Ângulos consecutivos somam 180°.'},
  {q:'Um retângulo tem lados 5 e 12. Quanto mede a diagonal?',options:['13','17','60','7'],answer:0,concept:'Diagonal do retângulo',explanation:'Pelo teorema de Pitágoras, √(5²+12²)=13.'},
  {q:'Um losango tem diagonais 8 cm e 6 cm. Sua área é:',options:['14 cm²','24 cm²','48 cm²','28 cm²'],answer:1,concept:'Área do losango',explanation:'A=D·d/2=8·6/2=24 cm².'}],exercises:[
  {q:'Um paralelogramo tem ângulos consecutivos na razão 1:3. Quanto mede o menor ângulo?',answers:['45','45°'],hint:'Ângulos consecutivos somam 180°.',concept:'Ângulos do paralelogramo',explanation:'x+3x=180°, então x=45°.'},
  {q:'Um trapézio tem bases 10 cm e 6 cm e altura 4 cm. Qual é a área?',answers:['32','32 cm2','32 cm²'],hint:'Use A=(B+b)·h/2.',concept:'Área do trapézio',explanation:'(10+6)·4/2=32 cm².'},
  {q:'O perímetro de um losango é 80 cm. Quanto mede cada lado?',answers:['20','20 cm'],hint:'Os quatro lados têm a mesma medida.',concept:'Propriedades do losango',explanation:'80/4=20 cm.'},
  {q:'Um retângulo tem lados 9 cm e 12 cm. Quanto mede a diagonal?',answers:['15','15 cm'],hint:'A diagonal é a hipotenusa do triângulo formado pelos lados.',concept:'Diagonal do retângulo',explanation:'√(9²+12²)=15 cm.'},
  {q:'Um losango tem diagonais 10 cm e 24 cm. Qual é o perímetro?',answers:['52','52 cm'],hint:'As diagonais se cortam perpendicularmente ao meio; use metades 5 e 12 para achar o lado.',concept:'Diagonal e lado do losango',explanation:'Cada lado mede √(5²+12²)=13 cm; perímetro=52 cm.'},
  {q:'Um paralelogramo tem base 9 cm e altura 5 cm. Calcule a área.',answers:['45','45 cm2','45 cm²'],hint:'Área do paralelogramo é base vezes altura.',concept:'Área do paralelogramo',explanation:'9·5=45 cm².'},
  {q:'Um trapézio retângulo tem ângulos não retos α e 5α. Quanto mede α?',answers:['30','30°'],hint:'Os dois ângulos não retos somam 180°.',concept:'Ângulos do trapézio retângulo',explanation:'6α=180°, então α=30°.'},
  {q:'As diagonais de um quadrilátero se cortam ao meio. Qual classe isso garante?',answers:['paralelogramo','um paralelogramo'],hint:'Essa propriedade caracteriza os paralelogramos; sozinha não garante ângulos retos.',concept:'Critérios de paralelogramo',explanation:'Diagonais que se bissetam mutuamente caracterizam um paralelogramo.'}],extra:[{q:'Um quadrado tem lado 7 cm. Qual é sua área?',answers:['49','49 cm2','49 cm²'],hint:'Área do quadrado é lado ao quadrado.',concept:'Área do quadrado',explanation:'7²=49 cm².'},{q:'Dois ângulos consecutivos de um paralelogramo: um mede 68°. Quanto mede o outro?',answers:['112','112°'],hint:'Eles são suplementares.',concept:'Ângulos do paralelogramo',explanation:'180°−68°=112°.'},{q:'Área de um losango com diagonais 14 cm e 10 cm?',answers:['70','70 cm2','70 cm²'],hint:'Multiplique as diagonais e divida por 2.',concept:'Área do losango',explanation:'14·10/2=70 cm².'}]},
 {id:'poligonos',name:'Polígonos',goal:'Classificar polígonos, calcular ângulos e diagonais e determinar a área de um polígono regular usando o apótema.',summary:['Polígono é uma linha poligonal fechada e simples. Elementos: lados, vértices, ângulos e diagonais.','Convexo: qualquer segmento entre pontos internos permanece na região; côncavo tem ângulo interno maior que 180°.','Em um polígono convexo de n lados: soma interna S=(n−2)·180°.','No regular: ângulo interno α=180°(n−2)/n; ângulo externo β=360°/n; diagonais D=n(n−3)/2.','Num polígono regular, a circunferência inscrita é tangente aos lados. O apótema é perpendicular ao lado e coincide com o raio dessa circunferência.','Área do polígono regular: A=P·a/2.'],cards:[['Soma dos ângulos internos de n-gono convexo?','(n−2)·180°.'],['Número de diagonais?','n(n−3)/2.'],['Ângulo externo do regular?','360°/n.'],['Área do polígono regular?','P·a/2.'],['O que é apótema?','Distância do centro ao lado; para a circunferência inscrita, é seu raio.']],quiz:[
  {q:'A soma dos ângulos internos de um hexágono convexo é:',options:['540°','720°','900°','1080°'],answer:1,concept:'Soma dos ângulos internos',explanation:'(6−2)·180°=720°.'},
  {q:'Quantas diagonais tem um octógono?',options:['16','20','24','28'],answer:1,concept:'Diagonais',explanation:'D=8·(8−3)/2=20.'},
  {q:'Cada ângulo externo de um decágono regular mede:',options:['18°','30°','36°','144°'],answer:2,concept:'Ângulo externo',explanation:'360°/10=36°.'},
  {q:'A área de um polígono regular de perímetro 30 cm e apótema 4 cm é:',options:['34 cm²','60 cm²','120 cm²','240 cm²'],answer:1,concept:'Área com apótema',explanation:'A=P·a/2=30·4/2=60 cm².'}],exercises:[
  {q:'Um polígono regular tem ângulo externo de 24°. Quantos lados possui?',answers:['15','15 lados'],hint:'A soma dos ângulos externos é 360°.',concept:'Número de lados e ângulo externo',explanation:'n=360°/24°=15 lados.'},
  {q:'Quantas diagonais possui um dodecágono?',answers:['54','54 diagonais'],hint:'Use D=n(n−3)/2.',concept:'Número de diagonais',explanation:'D=12·9/2=54.'},
  {q:'Qual é a soma dos ângulos internos de um eneágono convexo?',answers:['1260','1260°'],hint:'Eneágono tem 9 lados.',concept:'Soma dos ângulos internos',explanation:'(9−2)·180°=1260°.'},
  {q:'Quanto mede cada ângulo interno de um eneágono regular?',answers:['140','140°'],hint:'Divida a soma interna pelo número de ângulos.',concept:'Ângulo interno regular',explanation:'1260°/9=140°.'},
  {q:'Um polígono regular tem perímetro 36 cm e apótema 3 cm. Calcule a área.',answers:['54','54 cm2','54 cm²'],hint:'A=P·a/2.',concept:'Área com apótema',explanation:'36·3/2=54 cm².'},
  {q:'Um heptágono tem ângulos x, 2x, 3x, …, 7x. Quanto mede o maior ângulo?',answers:['225','225°'],hint:'A soma é 900°. Some 1x+2x+…+7x.',concept:'Ângulos de polígono côncavo e convexo',explanation:'28x=900°, x=225/7° e 7x=225°. Como o maior ângulo excede 180°, o heptágono é côncavo.'},
  {q:'Um polígono regular tem ângulo interno 150°. Quantos lados tem?',answers:['12','12 lados'],hint:'O externo é suplementar ao interno e vale 360°/n.',concept:'Ângulos e número de lados',explanation:'β=30°; n=360°/30°=12.'},
  {q:'Um polígono regular tem 35 diagonais. Quantos lados possui?',answers:['10','10 lados'],hint:'Resolva n(n−3)/2=35.',concept:'Número de diagonais',explanation:'n²−3n−70=0; a raiz positiva é n=10.'}],extra:[{q:'Quantos triângulos são formados ao traçar diagonais a partir de um vértice de um decágono convexo?',answers:['8','8 triângulos'],hint:'A triangulação gera n−2 triângulos.',concept:'Triangulação',explanation:'10−2=8.'},{q:'Qual é cada ângulo externo de um polígono regular de 15 lados?',answers:['24','24°'],hint:'Divida 360° por 15.',concept:'Ângulos externos',explanation:'360°/15=24°.'},{q:'Um polígono regular tem perímetro 48 e apótema 5. Qual é a área?',answers:['120','120 cm2','120 cm²'],hint:'A=P·a/2.',concept:'Área de polígono regular',explanation:'48·5/2=120.'}]}

deepContent.trig={goal:'Compreender ângulos, arcos, ciclo trigonométrico, valores notáveis e gráficos de seno, cosseno e tangente, incluindo período, domínio e imagem.',summary:['360°=2π rad=400 grados; π rad=180°=200 grados.','Arcos côngruos diferem por voltas completas: θ+360°k ou θ+2πk.','No ciclo unitário, P=(cos θ, sen θ); os sinais dependem do quadrante.','sen(bx+c) e cos(bx+c) têm período 2π/|b|; tg(bx+c), π/|b|.','Fator externo altera amplitude; translação vertical altera a imagem.'],theory:[{title:'Ângulos, arcos e unidades',text:'O giro anti-horário é positivo; o horário, negativo. Uma volta mede 360°, 2π rad ou 400 grados. Converta graus para radianos por π/180 e radianos para graus por 180/π. Arcos que diferem por voltas completas são côngruos.',example:'225°·π/180°=5π/4 rad. Reduzindo 1125° por 3·360°, obtemos 45°.'},{title:'Ciclo e valores notáveis',text:'No ciclo de raio 1, o ponto do arco θ é (cos θ, sen θ): cosseno é a abscissa e seno a ordenada. Sinais (cos,sen): I (+,+), II (−,+), III (−,−), IV (+,−). Construa valores de 30°, 45° e 60° com triângulos notáveis; use o ângulo de referência para outros quadrantes. tg θ=sen θ/cos θ, quando cos θ≠0.',example:'Se sen θ=3/5 no II quadrante, cos θ=−4/5 e tg θ=−3/4.'},{title:'Funções e gráficos',text:'Domínio de seno e cosseno: ℝ; imagem básica: [−1,1]; período: 2π. Tangente tem período π e não existe em π/2+kπ. Para sen(bx+c) e cos(bx+c), T=2π/|b|; para tg, T=π/|b|. O fator A fora da função muda amplitude e imagem, mas não T. Monte o gráfico em cinco pontos separados por T/4. O módulo pode reduzir o período: |sen(x+π)|=|sen x|, então seu período é π.',example:'cos(3x): T=2π/3. Para 2sen x, imagem [−2,2].'}],notebook:['Faça uma tabela 360°=2π=400 grados e conversões notáveis.','Desenhe o ciclo, quadrantes, sinais e pontos 0°, 90°, 180°, 270°.','Copie a tabela de sen/cos/tg para 0°, 30°, 45°, 60°, 90° e indique onde tg não existe.','Derive as regras de período; trace os cinco pontos principais de cos(3x) e 2sen x.'],cards:[['Meia volta em radianos?','π rad.'],['Como converter graus em radianos?','Multiplique por π/180.'],['Coordenadas no ciclo?','(cos θ, sen θ).'],['Onde cos é negativo?','Nos quadrantes II e III.'],['Quando tg não existe?','Quando cos θ=0.'],['Período de seno/cosseno?','2π.'],['Período de tg(bx)?','π/|b|.'],['Período de |sen x|?','π.']],quiz:[
{difficulty:'Fixação',concept:'Conversão',q:'225° equivalem a quantos radianos?',options:['5π/4','4π/5','3π/4','7π/6'],answer:0,explanation:'225π/180=5π/4. 3π/4 é 135°; 7π/6 é 210°.'},
{difficulty:'Fixação',concept:'Ciclo trigonométrico',q:'Qual é o ponto final de 3π/2?',options:['(0,−1)','(−1,0)','(0,1)','(1,0)'],answer:0,explanation:'3π/2=270°, no eixo vertical negativo: (0,−1).'},
{difficulty:'Fixação',concept:'Valores notáveis',q:'Quanto vale cos 60°?',options:['1/2','√3/2','√2/2','0'],answer:0,explanation:'cos 60°=1/2. √3/2 é sen 60°; √2/2 é o valor de 45°.'},
{difficulty:'Aplicação',concept:'Sinais e razões',q:'Se sen θ=3/5 no II quadrante, tg θ é:',options:['−3/4','3/4','−4/3','4/3'],answer:0,explanation:'No II quadrante cos é negativo. cos θ=−4/5; tg=(3/5)/(−4/5)=−3/4.'},
{difficulty:'Aplicação',concept:'Arcos côngruos',q:'Qual é o menor ângulo não negativo côngruo a 1125°?',options:['45°','125°','225°','315°'],answer:0,explanation:'1125°−3·360°=45°.'},
{difficulty:'Aplicação',concept:'Simetria no ciclo',q:'Quanto vale sen 150°?',options:['1/2','−1/2','√3/2','−√3/2'],answer:0,explanation:'150° está no II quadrante e tem ângulo de referência 30°; seno é positivo.'}],exercises:[
{difficulty:'Análise',concept:'Período',q:'Determine o período de cos(3x), em radianos.',answers:['2π/3','2pi/3'],hint:'T=2π/|b|.',solution:'b=3; T=2π/3. O fator 3 comprime o período por três.',explanation:'T=2π/3.',expected:'2π/3 rad.'},
{difficulty:'Análise',concept:'Periodicidade do módulo',q:'Qual é o período fundamental de |sen x|?',answers:['π','pi'],hint:'Use sen(x+π)=−sen x e aplique módulo.',solution:'|sen(x+π)|=|−sen x|=|sen x|; portanto, o padrão se repete após π.',explanation:'O período é π.',expected:'π rad.'},
{difficulty:'Análise',concept:'Período da tangente',q:'Determine o período de tg(πx−π/6).',answers:['1','1 unidade'],hint:'Para tg(bx+c), use T=π/|b|; o termo constante não altera o período.',solution:'O coeficiente de x é b=π. Então T=π/|π|=1. O deslocamento de fase −π/6 não altera o período.',explanation:'O período é 1.',expected:'1.'},
{difficulty:'Nível prova',concept:'Modelagem em cilindro',q:'Uma faixa planificada para envolver cilindro de raio 6/π cm tem diagonal a 30° da borda. Qual é a altura do cilindro?',answers:['4√3','4 raiz de 3','6.928','6,928'],hint:'A largura planificada é 2πr=12 cm; use tg 30°=altura/largura.',solution:'Largura=2π·6/π=12. h=12tg30°=12/√3=4√3≈6,93 cm.',explanation:'Altura 4√3 cm.',expected:'4√3 cm (≈6,93 cm).'},
{difficulty:'Nível prova',concept:'Aproximação por tabela',q:'Um prédio de 60 m tem deslocamento horizontal de 1,80 m. Usando a tabela de tangentes, estime o ângulo de inclinação em graus.',answers:['1.7','1,7'],hint:'tg α=1,80/60=0,03; compare com os valores tabulados próximos.',solution:'tg α=0,03. Na tabela, tg 1,5°≈0,026 e tg 1,8°≈0,031; logo α≈1,7°.',explanation:'Estimativa aproximada: 1,7°.',expected:'≈1,7°.'},
{difficulty:'Nível prova',concept:'Ângulo de elevação',q:'Um observador a 1,8 km da projeção de um balão mede 60°; outro, alinhado a 5,5 km, mede 30°. Qual é a altura aproximada coerente?',answers:['3.1','3,1'],hint:'Calcule h=d·tg(θ) para cada pessoa e compare.',solution:'1,8tg60°≈3,12 km; 5,5tg30°≈3,18 km. A diferença decorre de arredondamentos; ambas estimam cerca de 3,1 km.',explanation:'Altura aproximada 3,1 km.',expected:'≈3,1 km.'}]};

deepContent.relacoes={goal:'Usar seno, cosseno e tangente em triângulos retângulos, identidades e simplificações algébricas; modelar situações de inclinação e distância com escolha justificada da razão.',summary:['Hipotenusa é oposta ao ângulo reto; catetos dependem do ângulo agudo escolhido.','sen θ=oposto/hipotenusa; cos θ=adjacente/hipotenusa; tg θ=oposto/adjacente.','Pitágoras: a²+b²=c². Identidade: sen² θ+cos² θ=1.','tg θ=sen θ/cos θ quando cos θ≠0; o quadrante define o sinal.','Simplifique fatorando, substituindo identidades e registrando restrições de domínio.','Problemas de altura e inclinação exigem um esboço e atenção ao ângulo horizontal ou vertical.'],theory:[{title:'Identifique ângulo e lados',text:'A hipotenusa fica oposta ao ângulo de 90° e não muda. Em relação ao ângulo θ, o cateto oposto fica diante dele; o adjacente toca θ sem ser a hipotenusa. Ao escolher outro ângulo agudo, os catetos trocam de função.',example:'No triângulo 3–4–5, para o ângulo oposto ao lado 3: sen=3/5, cos=4/5 e tg=3/4.'},{title:'Construa a razão adequada',text:'Seno relaciona oposto e hipotenusa; cosseno, adjacente e hipotenusa; tangente, oposto e adjacente. Desenhe e marque os dados antes de montar uma equação. Use Pitágoras para achar o terceiro lado quando dois forem conhecidos.',example:'Se hipotenusa=10 e sen θ=3/5, o cateto oposto mede 10·3/5=6.'},{title:'Identidade fundamental e sinais',text:'De Pitágoras a²+b²=c², dividindo tudo por c², obtemos sen² θ+cos² θ=1. A identidade fornece o quadrado de uma razão; o quadrante decide seu sinal. A tangente também obedece tg θ=sen θ/cos θ quando cos θ não é zero.',example:'sen θ=3/5 no II quadrante: cos²=16/25, portanto cos=−4/5 e tg=−3/4.'},{title:'Simplifique sem perder condições',text:'Substitua 1−sen²x por cos²x ou reescreva tg x como sen x/cos x. Fatorações como a³−b³=(a−b)(a²+ab+b²) ajudam a reduzir expressões. Só cancele fatores não nulos; anote as restrições impostas pelos denominadores.',example:'(1−sen²x)/cos²x=cos²x/cos²x=1, desde que cos x≠0.'},{title:'Modele uma situação real',text:'Em elevação ou inclinação, desenhe a linha horizontal, a altura e a linha de visão. Verifique se o ângulo é medido da vertical ou da horizontal. Escolha a razão pelos lados conhecidos, converta unidades e avalie se o resultado é plausível.',example:'Altura vertical de 114 m e inclinação de 15° em relação à vertical: deslocamento horizontal≈114·tg15°.'}],notebook:['Desenhe e rotule hipotenusa, oposto e adjacente para θ.','Copie as três razões e resolva um exemplo 3–4–5 para cada cateto escolhido.','Derive sen² θ+cos² θ=1 a partir de Pitágoras e registre a regra de sinal por quadrante.','Faça um quadro de simplificação: expressão original, identidade usada, fator cancelado e condição.','Desenhe um problema de inclinação e indique ângulo, lados, equação e unidade.'],cards:[['Como localizar a hipotenusa?','Oposta ao ângulo reto.'],['Seno é qual razão?','Oposto/hipotenusa.'],['Cosseno é qual razão?','Adjacente/hipotenusa.'],['Tangente é qual razão?','Oposto/adjacente.'],['Qual identidade liga seno e cosseno?','sen² θ+cos² θ=1.'],['Quando tg=sen/cos?','Quando cos θ≠0.'],['O que determina o sinal da razão?','O quadrante do ângulo.'],['O que não pode esquecer ao simplificar?','Restrições de denominador e fatores não nulos.']],quiz:[
{difficulty:'Fixação',concept:'Hipotenusa',q:'Em um triângulo retângulo, a hipotenusa é o lado:',options:['oposto ao ângulo reto','adjacente a θ','menor lado','oposto ao maior ângulo agudo'],answer:0,explanation:'A hipotenusa é sempre oposta aos 90° e é o maior lado.'},
{difficulty:'Fixação',concept:'Definição de seno',q:'Em relação a θ, sen θ corresponde a:',options:['oposto/hipotenusa','adjacente/hipotenusa','oposto/adjacente','hipotenusa/oposto'],answer:0,explanation:'Seno usa cateto oposto dividido pela hipotenusa.'},
{difficulty:'Fixação',concept:'Identidade fundamental',q:'Qual relação vale para todo θ?',options:['sen²θ+cos²θ=1','senθ+cosθ=1','tgθ=cosθ/senθ','sen²θ−cos²θ=1'],answer:0,explanation:'A identidade fundamental é consequência do teorema de Pitágoras.'},
{difficulty:'Aplicação',concept:'Triângulo 3–4–5',q:'No triângulo 3–4–5, θ é oposto ao lado 3. Qual é cos θ?',options:['4/5','3/5','3/4','5/4'],answer:0,explanation:'O adjacente mede 4 e a hipotenusa 5; 3/5 seria seno e 3/4 tangente.'},
{difficulty:'Aplicação',concept:'Quadrante e tangente',q:'Se cos θ=−3/5 no III quadrante, quanto vale tg θ?',options:['4/3','−4/3','−3/4','3/4'],answer:0,explanation:'No III quadrante sen e cos são negativos, então tg é positiva. sen=−4/5 e tg=(−4/5)/(−3/5)=4/3.'},
{difficulty:'Aplicação',concept:'Razão com hipotenusa',q:'A hipotenusa mede 10 e sen θ=3/5. Qual é o cateto oposto?',options:['6','8','5','10/3'],answer:0,explanation:'oposto/10=3/5, então oposto=6.'}],exercises:[
{difficulty:'Análise',concept:'Razões no triângulo',q:'Os catetos oposto e adjacente a θ medem 5 e 12. Determine tg θ.',answers:['5/12'],hint:'Tangente usa os dois catetos.',solution:'tg θ=oposto/adjacente=5/12.',explanation:'tg θ=5/12.',expected:'5/12.'},
{difficulty:'Análise',concept:'Identidade e sinal',q:'Se sen θ=0,8 e θ está no primeiro quadrante, calcule tg θ.',answers:['4/3','1.333','1,333'],hint:'0,8=4/5; encontre cos θ pela identidade.',solution:'cos²θ=1−16/25=9/25; no primeiro quadrante cos=3/5. tg=(4/5)/(3/5)=4/3.',explanation:'tg θ=4/3.',expected:'4/3.'},
{difficulty:'Análise',concept:'Simplificação',q:'Para cos x≠0, simplifique (1−sen²x)/cos²x.',answers:['1'],hint:'Use a identidade fundamental.',solution:'1−sen²x=cos²x, então a fração é cos²x/cos²x=1. A condição impede divisão por zero.',explanation:'O resultado é 1.',expected:'1.'},
{difficulty:'Nível prova',concept:'Inclinação e área',q:'Uma torre de 114 m inclina 15° em relação à vertical. Use tg15°≈0,26; suponha base quadrada cujo lado é o deslocamento horizontal. Qual é aproximadamente a área da base?',answers:['878','878.5','878,5','maior que 700'],hint:'Calcule d=114·0,26 e depois A=d².',solution:'d≈29,64 m. A≈29,64²≈878,53 m², portanto a alternativa correta na lista seria maior que 700 m².',explanation:'Área aproximada de 879 m².',expected:'≈879 m².'},
{difficulty:'Nível prova',concept:'Fatoração e identidade',q:'Sabendo sen x≠cos x, simplifique (sen³x−cos³x)/(sen x−cos x).',answers:['1+senxcosx','1+sen x cos x'],hint:'Fatore a diferença de cubos e depois use sen²x+cos²x=1.',solution:'A fração vira sen²x+sen x cos x+cos²x. Pela identidade, o resultado é 1+sen x cos x.',explanation:'Resultado: 1+sen x cos x.',expected:'1+sen x cos x.'},
{difficulty:'Nível prova',concept:'Expressão com tangente',q:'Se tg θ=3/4, calcule 2tg θ/(1−tg² θ).',answers:['24/7'],hint:'Substitua 3/4 e reduza o denominador a uma fração.',solution:'Numerador=3/2. Denominador=1−9/16=7/16. Dividir por 7/16 equivale a multiplicar por 16/7: (3/2)(16/7)=24/7.',explanation:'O valor é 24/7.',expected:'24/7.'}]};

deepContent.quadrilateros={goal:'Classificar quadriláteros, justificar propriedades de lados, ângulos e diagonais e resolver problemas de área, sem depender de desenhos em escala.',summary:['Todo quadrilátero tem soma angular 360° e duas diagonais.','Paralelogramo: lados opostos paralelos e congruentes; ângulos opostos congruentes; diagonais se cortam ao meio.','Retângulo: quatro ângulos retos; diagonais congruentes. Losango: quatro lados iguais; diagonais perpendiculares.','Quadrado reúne propriedades de retângulo e losango.','Trapézio: bases paralelas; A=(B+b)h/2. Losango: A=Dd/2.','Área do paralelogramo é base vezes altura perpendicular, não base vezes lado inclinado.'],theory:[{title:'Classificação e hierarquia',text:'Quadriláteros têm quatro lados, quatro vértices, duas diagonais e soma interna 360°. Paralelogramo tem dois pares de lados paralelos. Retângulo tem quatro ângulos retos; losango tem quatro lados iguais; quadrado reúne as duas propriedades. Trapézio possui bases paralelas. ⚠ Verificar no material: a convenção pode exigir exatamente um par de lados paralelos ou aceitar ao menos um.',example:'Todo quadrado é retângulo e losango; um retângulo de lados diferentes não é quadrado.'},{title:'Ângulos e diagonais',text:'No paralelogramo, lados opostos são paralelos e congruentes, ângulos opostos são iguais, consecutivos somam 180° e diagonais se bissetam. No retângulo, diagonais também são congruentes. No losango, diagonais são perpendiculares e bissetam os ângulos. Bissetar-se mutuamente garante paralelogramo, mas não garante retângulo.',example:'Razão 1:3 entre ângulos consecutivos: x+3x=180°, então 45° e 135°.'},{title:'Áreas e perímetros',text:'Paralelogramo: A=b·h, com h perpendicular à base. Trapézio: A=(B+b)·h/2. Losango: A=D·d/2. Retângulo: A=bh; quadrado: A=l². Perímetro é soma dos lados. Decomponha figuras compostas e não confunda altura com lado oblíquo.',example:'Bases 10 e 6, altura 4: A=(10+6)·4/2=32.'},{title:'Triângulos dentro das figuras',text:'Questões de quadriláteros podem exigir semelhança e paralelismo. Triângulos equiláteros quaisquer são semelhantes. Uma reta que passa pelo ponto médio de um lado de triângulo e é paralela a outro lado encontra o terceiro lado no ponto médio. Peças congruentes preservam lados e ângulos.',example:'Se M é ponto médio de AB e MN∥BC, então N é ponto médio de AC.'}],notebook:['Faça a hierarquia paralelogramo → retângulo/losango → quadrado e inclua trapézio segundo a convenção da aula.','Monte um quadro de lados, ângulos e diagonais para paralelogramo, retângulo, losango e quadrado.','Copie as fórmulas de área e destaque a altura perpendicular.','Escreva uma propriedade e sua recíproca; marque o que se pode concluir e o que não se pode.','Desenhe seis losangos congruentes em torno de um ponto e deduza os ângulos.'],cards:[['Soma angular do quadrilátero?','360°.'],['Diagonais do paralelogramo?','Bissetam-se.'],['Diagonais do retângulo?','Bissetam-se e são congruentes.'],['Diagonais do losango?','São perpendiculares e bissetam-se.'],['O que reúne quadrado?','Propriedades de retângulo e losango.'],['Área do trapézio?','(B+b)h/2.'],['Área do losango?','Dd/2.'],['Área do paralelogramo?','Base vezes altura perpendicular.']],quiz:[
{difficulty:'Fixação',concept:'Soma angular',q:'A soma dos ângulos internos de qualquer quadrilátero é:',options:['360°','180°','540°','270°'],answer:0,explanation:'Uma diagonal o divide em dois triângulos: 2·180°=360°.'},
{difficulty:'Fixação',concept:'Paralelogramo',q:'Qual propriedade vale para as diagonais de todo paralelogramo?',options:['Bissetam-se','São congruentes','São perpendiculares','Bissetam todos os ângulos'],answer:0,explanation:'Elas se cortam ao meio. Congruência é característica do retângulo; perpendicularidade, do losango.'},
{difficulty:'Fixação',concept:'Losango',q:'Qual condição define um losango?',options:['Quatro lados congruentes','Quatro ângulos retos','Um par de lados paralelos','Diagonais congruentes'],answer:0,explanation:'Losango tem quatro lados iguais; ângulos retos definem retângulo.'},
{difficulty:'Aplicação',concept:'Ângulos consecutivos',q:'Ângulos consecutivos de um paralelogramo estão na razão 1:3. Qual é o menor?',options:['45°','60°','30°','90°'],answer:0,explanation:'x+3x=180°, logo x=45°.'},
{difficulty:'Aplicação',concept:'Área do trapézio',q:'Bases 10 cm e 6 cm, altura 4 cm. Qual é a área?',options:['32 cm²','64 cm²','40 cm²','16 cm²'],answer:0,explanation:'A=(10+6)·4/2=32 cm².'},
{difficulty:'Aplicação',concept:'Diagonal do retângulo',q:'Um retângulo tem lados 9 cm e 12 cm. Quanto mede a diagonal?',options:['15 cm','21 cm','12 cm','√21 cm'],answer:0,explanation:'Pitágoras: √(9²+12²)=15 cm.'}],exercises:[
{difficulty:'Análise',concept:'Recíproca',q:'As diagonais de um quadrilátero se cortam ao meio. Qual classe isso garante?',answers:['paralelogramo','um paralelogramo'],hint:'Não acrescente a condição de ângulo reto sem evidência.',solution:'Diagonais que se bissetam caracterizam um paralelogramo. Não garantem retângulo; poderia ser, por exemplo, um paralelogramo oblíquo.',explanation:'Garante paralelogramo, não necessariamente retângulo.',expected:'Paralelogramo.'},
{difficulty:'Análise',concept:'Losango e Pitágoras',q:'Um losango tem diagonais 10 cm e 24 cm. Quanto mede o lado?',answers:['13','13 cm'],hint:'Use metades das diagonais: 5 e 12.',solution:'As diagonais perpendiculares se dividem ao meio; o lado é √(5²+12²)=13 cm.',explanation:'O lado mede 13 cm.',expected:'13 cm.'},
{difficulty:'Análise',concept:'Classificação',q:'Um paralelogramo tem quatro ângulos retos, mas nada foi informado sobre seus lados adjacentes. Qual classe pode ser garantida?',answers:['retangulo','retângulo'],hint:'Para concluir quadrado, faltaria provar que dois lados adjacentes são congruentes.',solution:'É um retângulo. Pode ser quadrado se os lados também forem iguais, mas isso não foi dado.',explanation:'Retângulo; quadrado não pode ser concluído.',expected:'Retângulo.'},
{difficulty:'Nível prova',concept:'Peças congruentes',q:'Seis losangos congruentes ocupam uma volta completa em torno de um ponto, com um vértice de cada losango nesse ponto. Quanto mede esse ângulo de cada losango?',answers:['60','60°'],hint:'Os ângulos ao redor de um ponto somam 360°.',solution:'360°/6=60°. Como ângulos consecutivos do losango são suplementares, o outro ângulo é 120°.',explanation:'O ângulo procurado mede 60°.',expected:'60°.'},
{difficulty:'Nível prova',concept:'Teorema da reta paralela',q:'No triângulo ABC, M é ponto médio de AB. A paralela a BC por M encontra AC em N. Se AC=18 cm, determine AN.',answers:['9','9 cm'],hint:'A paralela pelo ponto médio divide o terceiro lado ao meio.',solution:'Pelo teorema da reta paralela, N é ponto médio de AC; AN=18/2=9 cm.',explanation:'AN=9 cm.',expected:'9 cm.'},
{difficulty:'Nível prova',concept:'Diagonal e perímetro',q:'Um losango tem diagonais 16 cm e 30 cm. Qual é o perímetro?',answers:['68','68 cm'],hint:'Metades das diagonais são catetos 8 e 15; encontre um lado e multiplique por 4.',solution:'l=√(8²+15²)=17 cm. P=4·17=68 cm.',explanation:'Perímetro 68 cm.',expected:'68 cm.'}]};

deepContent.poligonos={goal:'Deduzir e inverter fórmulas de ângulos e diagonais, reconhecer polígonos convexos e regulares e resolver problemas de área usando o apótema e a circunferência inscrita.',summary:['Polígono é uma linha poligonal fechada e simples; convexo não tem reentrância; côncavo tem ângulo interno maior que 180°.','Soma interna de convexo: S=(n−2)·180°. No regular: cada interno=180°(n−2)/n.','A soma dos ângulos externos, um por vértice, é 360°; no regular, cada externo=360°/n.','Diagonais: D=n(n−3)/2; cada diagonal seria contada nos dois extremos.','Apótema é perpendicular ao lado; numa circunferência inscrita, o raio coincide com o apótema.','Área do polígono regular: A=P·a/2.'],theory:[{title:'Elementos e convexidade',text:'Polígono é uma linha poligonal fechada e simples. Tem lados, vértices, ângulos internos e diagonais entre vértices não consecutivos. Convexo não tem reentrâncias; côncavo tem ao menos um ângulo interno maior que 180°. Regular exige todos os lados e todos os ângulos congruentes.',example:'De um vértice de um hexágono convexo partem três diagonais, formando quatro triângulos.'},{title:'Ângulos internos e externos',text:'Traçando diagonais a partir de um vértice de um polígono convexo de n lados, formam-se n−2 triângulos; S=(n−2)·180°. No regular, divida por n para obter cada ângulo interno. Um externo e o interno adjacente somam 180°; um externo em cada vértice totaliza 360°.',example:'Decágono regular: interno=8·180/10=144°; externo=36°.'},{title:'Número de diagonais',text:'De cada vértice saem n−3 diagonais, pois não há diagonal para si mesmo nem para os dois vizinhos. Somando pelos n vértices, cada segmento aparece duas vezes; D=n(n−3)/2. A fórmula inversa pode ser usada para testar quantos lados tem uma figura a partir das diagonais.',example:'Dodecágono: D=12·9/2=54. Se D=35, então n(n−3)=70, n=10.'},{title:'Apótema e área',text:'Unir o centro aos vértices divide um regular em triângulos isósceles. O apótema é a altura perpendicular de cada triângulo até o lado; somando as áreas, A=n·l·a/2. Como P=n·l, A=P·a/2. Na circunferência inscrita, o raio até o ponto de tangência é perpendicular ao lado e tem comprimento igual ao apótema.',example:'Se P=60 cm e a=4 cm, A=60·4/2=120 cm².'},{title:'Problemas com circunferência inscrita',text:'Quando a circunferência está inscrita em um quadrado, seu diâmetro é o lado do quadrado. Em um polígono regular, use o apótema e triângulos retângulos para relacionar lado, perímetro e área. Não confunda raio inscrito (centro até o lado) com distância até um vértice.',example:'Círculo inscrito no quadrado com C=77,5 cm e π=3,1: diâmetro=25 cm, então área do quadrado=625 cm².'}],notebook:['Desenhe um convexo e um côncavo; marque lados, vértices, ângulos e diagonais.','Demonstre S=(n−2)·180° por triangulação e deduza as fórmulas do regular.','Explique por que D=n(n−3)/2 inclui uma divisão por 2.','Desenhe o apótema perpendicular ao lado e deduza A=P·a/2.','Resolva um problema com circunferência inscrita conferindo raio, diâmetro e unidade da área.'],cards:[['Soma dos ângulos internos?','(n−2)·180°.'],['Ângulo interno regular?','180°(n−2)/n.'],['Soma dos externos?','360°.'],['Número de diagonais?','n(n−3)/2.'],['Apótema?','Perpendicular do centro ao lado.'],['Área regular?','P·a/2.'],['Raio da circunferência inscrita?','É igual ao apótema.'],['Por que dividir diagonais por 2?','Cada diagonal é contada nos dois vértices.']],quiz:[
{difficulty:'Fixação',concept:'Soma interna',q:'Qual é a soma interna de um heptágono convexo?',options:['900°','720°','1080°','1260°'],answer:0,explanation:'(7−2)·180°=900°. A fórmula usa n−2 triângulos.'},
{difficulty:'Fixação',concept:'Diagonais',q:'Quantas diagonais tem um nonágono?',options:['27','18','36','54'],answer:0,explanation:'9(9−3)/2=27.'},
{difficulty:'Fixação',concept:'Ângulo externo',q:'Quanto mede cada externo de um octógono regular?',options:['45°','60°','135°','22,5°'],answer:0,explanation:'360°/8=45°; 135° é o interno.'},
{difficulty:'Aplicação',concept:'Número de lados',q:'Um regular tem ângulo externo 24°. Quantos lados possui?',options:['15','12','18','24'],answer:0,explanation:'n=360°/24°=15.'},
{difficulty:'Aplicação',concept:'Área pelo apótema',q:'P=60 cm e apótema=4 cm. Qual é a área?',options:['120 cm²','240 cm²','64 cm²','30 cm²'],answer:0,explanation:'A=P·a/2=120 cm².'},
{difficulty:'Aplicação',concept:'Ângulo interno regular',q:'Quanto mede cada ângulo interno de um decágono regular?',options:['144°','150°','36°','120°'],answer:0,explanation:'S=8·180=1440°; 1440°/10=144°.'}],exercises:[
{difficulty:'Análise',concept:'Compatibilidade geométrica',q:'Um heptágono tem ângulos x,2x,3x,4x,5x,6x,7x. Calcule o maior ângulo em graus.',answers:['225','225°'],hint:'Iguale 28x à soma interna de um heptágono. Depois compare o maior ângulo com 180°.',solution:'28x=900°, então x=225/7°. O maior é 7x=225°, maior que 180°; logo, não pode ser convexo e a figura é côncava.',explanation:'Maior ângulo 225°; o polígono é côncavo.',expected:'225°; côncavo.'},
{difficulty:'Análise',concept:'Inverter fórmulas',q:'Um regular tem ângulo interno de 156°. Quantas diagonais possui?',answers:['90','90 diagonais'],hint:'Ache o externo, depois n e finalmente D.',solution:'Externo=180−156=24°. n=360/24=15. D=15·12/2=90.',explanation:'90 diagonais.',expected:'90.'},
{difficulty:'Análise',concept:'Hexágono e apótema inscrito',q:'Um círculo de raio 3 m está inscrito em um hexágono regular. Qual é a área do hexágono?',answers:['18√3','18 raiz de 3'],hint:'O raio é apótema. Num hexágono, a=√3·l/2.',solution:'a=3 e l=2√3. P=12√3. A=P·a/2=(12√3·3)/2=18√3 m².',explanation:'Área=18√3 m².',expected:'18√3 m².'},
{difficulty:'Nível prova',concept:'Circunferência inscrita no quadrado',q:'Uma circunferência inscrita em uma placa quadrada tem comprimento 77,5 cm. Use π=3,1. Qual é a área da placa?',answers:['625','625 cm2','625 cm²'],hint:'C=πd; o diâmetro coincide com o lado do quadrado.',solution:'d=77,5/3,1=25 cm. A placa tem lado 25 cm; área=25²=625 cm².',explanation:'Área=625 cm².',expected:'625 cm².'},
{difficulty:'Nível prova',concept:'Decomposição e área',q:'Um regular tem 12 lados de 5 cm e apótema 7 cm. Calcule a área.',answers:['210','210 cm2','210 cm²'],hint:'Calcule primeiro o perímetro.',solution:'P=12·5=60 cm. A=60·7/2=210 cm².',explanation:'Área=210 cm².',expected:'210 cm².'},
{difficulty:'Nível prova',concept:'Fórmula das diagonais',q:'Um polígono convexo tem 35 diagonais. Quantos lados possui?',answers:['10','10 lados'],hint:'Resolva n(n−3)/2=35 e verifique as raízes possíveis.',solution:'n(n−3)=70, então n²−3n−70=0=(n−10)(n+7). Como n≥3, n=10 lados.',explanation:'É um decágono, com 10 lados.',expected:'10 lados.'}]};

deepContent.trig.traps=['Confundir coordenadas: cosseno é x e seno é y.','Usar o sinal apenas pelo valor de referência e esquecer o quadrante.','Aplicar período 2π/|b| à tangente, cujo período é π/|b|.','Achar que amplitude ou translação vertical altera o período.','Esquecer que graus e radianos não podem ser somados sem conversão.'];deepContent.trig.studyQuestions=['Como reduzo um ângulo a uma volta sem alterar seu ponto final?','Como o quadrante determina os sinais de sen, cos e tg?','O que muda no gráfico quando altero o fator de x? E quando altero o fator externo?'];
deepContent.relacoes.traps=['Trocar cateto oposto e adjacente quando muda o ângulo de referência.','Usar a hipotenusa como cateto ou escolher a razão antes de nomear os lados.','Extrair raiz da identidade sem verificar o quadrante e o sinal.','Cancelar fator que pode ser zero ou ignorar domínio da fração.','Confundir ângulo da vertical com ângulo da horizontal em problemas de inclinação.'];deepContent.relacoes.studyQuestions=['Por que a hipotenusa não muda quando escolho outro ângulo agudo?','Como deduzo sen²θ+cos²θ=1 a partir de Pitágoras?','Quais dados do desenho justificam seno, cosseno ou tangente?','Que restrições devo verificar antes de simplificar uma expressão?'];
deepContent.quadrilateros.traps=['Achar que diagonais que se bissetam também precisam ser congruentes ou perpendiculares.','Concluir que um retângulo é quadrado sem provar lados adjacentes iguais.','Usar o lado inclinado como altura de um paralelogramo.','Aplicar a área do trapézio sem dividir a soma das bases por 2.','Assumir propriedades a partir de um desenho que não está em escala.'];deepContent.quadrilateros.studyQuestions=['Qual propriedade diferencia retângulo de losango? E o que o quadrado combina?','O que as diagonais permitem concluir e o que não permitem?','Como identifico a altura perpendicular na figura?','Que paralelismos ou pontos médios podem revelar triângulos semelhantes?'];
deepContent.poligonos.traps=['Usar n·180° para soma interna em vez de (n−2)·180°.','Confundir ângulo interno do regular com ângulo externo suplementar.','Esquecer que cada diagonal é contada duas vezes.','Confundir raio da circunferência inscrita, igual ao apótema, com distância ao vértice.','Usar perímetro em uma fórmula de área sem manter unidades quadradas.'];deepContent.poligonos.studyQuestions=['Como a triangulação justifica a fórmula da soma interna?','Por que a fórmula de diagonais divide por 2?','Por que o apótema precisa ser perpendicular ao lado para calcular a área?','Como reconheço se os dados do problema descrevem um polígono convexo?'];
