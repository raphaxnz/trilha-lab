const storedPref=JSON.parse(localStorage.getItem('gt-pref')||'null');if(storedPref&&Array.isArray(storedPref.ids)){const ids=storedPref.ids,oldAll=['arcos','funcoes','trig-retangulo','quadrilateros','poligonos'];if(ids.some(x=>oldAll.includes(x))){const mapped=[];if(ids.some(x=>['arcos','funcoes'].includes(x)))mapped.push('trig');if(ids.includes('trig-retangulo'))mapped.push('relacoes');if(ids.includes('quadrilateros'))mapped.push('quadrilateros');if(ids.includes('poligonos'))mapped.push('poligonos');storedPref.ids=mapped.length?mapped:moduleData.map(t=>t.id);localStorage.setItem('gt-pref',JSON.stringify(storedPref));}}
activeTopics=function(){return DATA.topics;};
state.modules=state.modules||{};state.done=state.done||{};state.answers=state.answers||{};if(state.learningVersion!==4){state.learningVersion=4;save();}const allTopicsPref=JSON.parse(localStorage.getItem('gt-pref')||'{}');allTopicsPref.ids=moduleData.map(t=>t.id);allTopicsPref.minutes=allTopicsPref.minutes||25;localStorage.setItem('gt-pref',JSON.stringify(allTopicsPref));
let flow=null;
function persistFlow(){if(flow){state.modules[flow.id]={...flow};save();}}
function showSteps(active){return `<div class="flow-steps"><span class="${active==='level'?'current':''}">01 Nível</span><span class="${active==='summary'?'current':''}">02 Resumo</span><span class="${active==='quiz'?'current':''}">03 Quiz</span><span class="${active==='exercises'?'current':''}">04 Exercícios</span><span class="${active==='results'||active==='review'?'current':''}">05 Revisão</span></div>`;}
function flowHeading(title,tag,sub){return `<div class="flow-heading"><div><span class="eyebrow">${sub||'TRILHALAB · MÓDULO'}</span><h1>${title}</h1></div><span class="pill flow-tag">${tag}</span></div>`;}
function modulePrompt(id){const t=DATA.topics.find(x=>x.id===id);if(!t)return;topic=t;flow={id,phase:'level',quizIndex:0,exerciseIndex:0,quizAnswers:{},exerciseAnswers:{},extraIndex:0,extraAnswers:{}};renderFlow();}
function chooseLevel(level){flow.level=level;flow.phase='summary';persistFlow();renderFlow();}
function renderTheory(){const theory=(topic.theory||[]).map((x,i)=>'<article class="theory-block"><span class="eyebrow">CONCEITO '+String(i+1).padStart(2,'0')+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p>'+(x.example?'<div class="worked-example"><b>Exemplo guiado</b><p>'+esc(x.example)+'</p></div>':'')+'</article>').join('');const notes=(topic.notebook||[]).map(x=>'<li>'+esc(x)+'</li>').join(''),traps=(topic.traps||[]).map(x=>'<li>'+esc(x)+'</li>').join(''),questions=(topic.studyQuestions||[]).map(x=>'<li>'+esc(x)+'</li>').join('');return '<section class="theory-grid" aria-label="Aula resumida">'+theory+'</section><section class="notebook-card"><span class="eyebrow">PARA REGISTRAR NO CADERNO</span><h2>Roteiro de estudo</h2><ol>'+notes+'</ol><h3>Perguntas para responder com suas palavras</h3><ol>'+questions+'</ol></section><section class="trap-card"><span class="eyebrow">ATENÇÃO ÀS PEGADINHAS</span><ul>'+traps+'</ul></section>'; }
function renderLevelScore(s){return '<section class="difficulty-results"><h3>Desempenho por nível</h3>'+s.levels.map(x=>'<div class="difficulty-line"><b>'+esc(x.label)+'</b><span>'+x.correct+' de '+x.total+' corretas</span></div>').join('')+'</section>'; }
function renderFlow(){if(!flow)return;topic=DATA.topics.find(t=>t.id===flow.id);page='lesson';nav();const app=$('#app');
 if(flow.phase==='level'){app.innerHTML=`<div class="learning-shell">${showSteps('level')}${flowHeading(esc(topic.name),'ESCOLHA SEU NÍVEL','ETAPA 1 · PERSONALIZE SEU ESTUDO')}<p class="flow-intro">Como você quer começar este módulo?</p><div class="level-grid"><button class="level-card" onclick="chooseLevel('zero')"><span class="level-number">01</span><b>Quero aprender do zero</b><small>Comece pelos conceitos fundamentais, com explicações passo a passo.</small></button><button class="level-card" onclick="chooseLevel('intermediario')"><span class="level-number">02</span><b>Já tenho uma base</b><small>Revise as ideias principais e aplique em questões variadas.</small></button><button class="level-card" onclick="chooseLevel('avancado')"><span class="level-number">03</span><b>Quero aprofundar</b><small>Vá direto às relações e aos desafios mais exigentes.</small></button></div><button class="secondary back-home" onclick="dashboard()">Voltar à trilha</button></div>`;return;}
 if(flow.phase==='summary'){const levelLabel={zero:'Do zero',intermediario:'Intermediário',avancado:'Avançado'}[flow.level];const guidance={zero:'Vamos construir a base com definições, fórmulas e exemplos guiados.',intermediario:'Vamos revisar os conceitos essenciais e praticar a escolha do método.',avancado:'Vamos priorizar relações entre conceitos, interpretação e resolução autônoma.'}[flow.level];app.innerHTML=`<div class="learning-shell">${showSteps('summary')}${flowHeading(esc(topic.name),levelLabel,'ETAPA 2 · RESUMO DO MÓDULO')}<div class="summary-card"><p>${esc(topic.goal)}</p><p class="level-guidance">${guidance}</p><h2>Conceitos deste módulo</h2><ol class="concept-list">${topic.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>${renderTheory()}<div class="flow-actions"><button class="secondary" onclick="backToLevel()">Voltar</button><button onclick="startModuleQuiz()">Avançar para o quiz</button></div></div>`;return;}
 if(flow.phase==='quiz'){const q=topic.quiz[flow.quizIndex],chosen=flow.quizAnswers[flow.quizIndex];app.innerHTML=`<div class="learning-shell">${showSteps('quiz')}${flowHeading(esc(topic.name),'QUIZ · '+(flow.quizIndex+1)+' DE '+topic.quiz.length,'ETAPA 3 · VERIFIQUE SUA COMPREENSÃO')}<section class="practice-card"><span class="eyebrow">${esc(q.difficulty||'Revisão')} · ${esc(q.concept)}</span><h2>${esc(q.q)}</h2><div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option ${chosen===i?'selected':''} ${chosen!==undefined&&i===q.answer?'correct':''} ${chosen===i&&i!==q.answer?'incorrect':''}" ${chosen!==undefined?'disabled':''} onclick="answerQuiz(${i})"><span>${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')}</div>${chosen!==undefined?`<div class="answer-explain ${chosen===q.answer?'is-correct':'is-wrong'}"><b>${chosen===q.answer?'Resposta correta':'Vamos revisar esta ideia'}</b><p>${esc(q.explanation)}</p></div>`:''}</section><div class="flow-actions"><button class="secondary" onclick="backToSummary()">Voltar ao resumo</button>${chosen!==undefined?`<button onclick="advanceQuiz()">${flow.quizIndex+1===topic.quiz.length?'Ir para os exercícios':'Próxima pergunta'}</button>`:''}</div></div>`;return;}
 if(flow.phase==='exercises'||flow.phase==='extra'){const extra=flow.phase==='extra',bank=extra?topic.extra:topic.exercises,idx=extra?flow.extraIndex:flow.exerciseIndex,e=bank[idx],record=extra?flow.extraAnswers[idx]:flow.exerciseAnswers[idx],total=bank.length;app.innerHTML=`<div class="learning-shell">${showSteps('exercises')}${flowHeading(esc(topic.name),(extra?'PRÁTICA EXTRA ':'EXERCÍCIO ')+(idx+1)+' DE '+total,'ETAPA 4 · RESOLVA E REGISTRE')}<section class="practice-card"><span class="eyebrow">${esc(e.difficulty||'PRÁTICA ADICIONAL')} · ${esc(e.concept)}</span><h2>${esc(e.q)}</h2><label class="answer-field">Sua resposta<input id="exerciseAnswer" value="${esc(flow.currentInput||record?.given||'')}" ${record?'disabled':''} oninput="saveExerciseDraft(this.value)" placeholder="Digite sua resposta" autocomplete="off"></label><div class="hint-row"><button class="hint-button secondary" onclick="toggleHint()">${flow.showHint?'Ocultar dica':'Preciso de uma dica'}</button><div id="hintBox" class="hint-box ${flow.showHint?'visible':''}">${flow.showHint?esc(e.hint):''}</div></div>${record?`<div class="answer-explain ${record.correct?'is-correct':'is-wrong'}"><b>${record.correct?'Correto':'Resposta para revisar'}</b><p>${esc(e.explanation)}</p><p><strong>Resposta esperada:</strong> ${esc(e.expected||e.answers[0])}</p><p><strong>Raciocínio:</strong> ${esc(e.solution||e.explanation)}</p></div>`:''}</section><div class="flow-actions"><button class="secondary" onclick="backFromExercise()">Voltar</button>${record?`<button onclick="advanceExercise('${extra?'extra':'main'}')">${idx+1===total?(extra?'Concluir prática':'Ver meu resultado'):'Próximo exercício'}</button>`:`<button onclick="checkExercise('${extra?'extra':'main'}')">Conferir resposta</button>`}</div><p class="answer-note">Se uma resposta equivalente não for reconhecida, compare com a resolução e considere o raciocínio apresentado.</p></div>`;return;}
 if(flow.phase==='extraDone'){app.innerHTML=`<div class="learning-shell">${showSteps('review')}${flowHeading('Prática concluída','REVISÃO','MÓDULO · '+esc(topic.name))}<div class="summary-card"><h2>Você terminou os exercícios extras.</h2><p>Revise os conceitos sinalizados e refaça os itens que quiser.</p></div><div class="flow-actions"><button class="secondary" onclick="goToReview()">Voltar à revisão</button><button onclick="dashboard()">Voltar à trilha</button></div></div>`;return;}
 if(flow.phase==='results'){renderResults();return;}if(flow.phase==='review'){renderReview();return;}
}
function answerQuiz(i){flow.quizAnswers[flow.quizIndex]=i;state.total++;if(i===topic.quiz[flow.quizIndex].answer)state.correct++;persistFlow();renderFlow();}
function backToLevel(){flow.phase='level';persistFlow();renderFlow();}
function startModuleQuiz(){flow.phase='quiz';flow.quizIndex=0;persistFlow();renderFlow();}
function backToSummary(){flow.phase='summary';persistFlow();renderFlow();}
function goToReview(){flow.phase='review';persistFlow();renderFlow();}
function backToResults(){flow.phase='results';renderFlow();}
function advanceQuiz(){flow.quizIndex++;if(flow.quizIndex>=topic.quiz.length){flow.phase='exercises';flow.exerciseIndex=0;flow.showHint=flow.level==='zero';}persistFlow();renderFlow();}
function toggleHint(){flow.showHint=!flow.showHint;renderFlow();}
function normalizeAnswer(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/°/g,'').replace(/\s+/g,'').replace(/,/g,'.').replace(/cm²|cm2|m²|m2|km²|km2|cm|km|m|graus|grau|rad$/g,'').replace(/[−–]/g,'-');}
function saveExerciseDraft(value){flow.currentInput=value;persistFlow();}
function checkExercise(kind){const extra=kind==='extra',idx=extra?flow.extraIndex:flow.exerciseIndex,bank=extra?topic.extra:topic.exercises,e=bank[idx],given=$('#exerciseAnswer').value.trim();if(!given){alert('Digite uma resposta antes de conferir.');return;}const ok=e.answers.some(a=>normalizeAnswer(a)===normalizeAnswer(given));if(extra)flow.extraAnswers[idx]={given,correct:ok};else flow.exerciseAnswers[idx]={given,correct:ok};state.total++;if(ok)state.correct++;flow.currentInput='';flow.showHint=false;persistFlow();renderFlow();}
function advanceExercise(kind){flow.currentInput='';if(kind==='extra'){flow.extraIndex++;if(flow.extraIndex>=topic.extra.length){flow.phase='extraDone';persistFlow();renderFlow();}else{flow.showHint=false;persistFlow();renderFlow();}return;}flow.exerciseIndex++;if(flow.exerciseIndex>=topic.exercises.length){flow.phase='results';state.done[topic.id]=true;persistFlow();save();renderFlow();}else{flow.showHint=false;persistFlow();renderFlow();}}
function backFromExercise(){if(flow.phase==='extra'){flow.extraIndex=Math.max(0,flow.extraIndex-1);}else if(flow.exerciseIndex>0){flow.exerciseIndex--;}else{flow.phase='quiz';flow.quizIndex=topic.quiz.length-1;}persistFlow();renderFlow();}
function scoreFlow(){const qTotal=topic.quiz.length,eTotal=topic.exercises.length,attemptedQ=Object.keys(flow.quizAnswers).length,attemptedE=Object.keys(flow.exerciseAnswers).length,correctQ=Object.entries(flow.quizAnswers).filter(([i,a])=>a===topic.quiz[+i].answer).length,correctE=Object.values(flow.exerciseAnswers).filter(x=>x.correct).length,total=qTotal+eTotal,correct=correctQ+correctE,levels=['Fixação','Aplicação','Análise','Nível prova'].map(label=>{const items=[...topic.quiz.map((q,i)=>({difficulty:q.difficulty,correct:flow.quizAnswers[i]===q.answer})),...topic.exercises.map((e,i)=>({difficulty:e.difficulty,correct:!!flow.exerciseAnswers[i]?.correct}))].filter(x=>x.difficulty===label);return{label,total:items.length,correct:items.filter(x=>x.correct).length}});return{qTotal,eTotal,attemptedQ,attemptedE,correctQ,correctE,total,correct,wrong:total-correct,pct:Math.round(correct/total*100),levels}}
function renderResults(){const s=scoreFlow();const allWrong=[];topic.quiz.forEach((q,i)=>{if(flow.quizAnswers[i]!==q.answer)allWrong.push({q:q.q,concept:q.concept,difficulty:q.difficulty,answer:q.options[q.answer],explanation:q.explanation,solution:q.explanation})});topic.exercises.forEach((e,i)=>{if(!flow.exerciseAnswers[i]?.correct)allWrong.push({q:e.q,concept:e.concept,difficulty:e.difficulty,answer:e.expected||e.answers[0],explanation:e.explanation,solution:e.solution||e.explanation})});flow.wrongs=allWrong;persistFlow();page='lesson';nav();$('#app').innerHTML=`<div class="learning-shell">${showSteps('results')}${flowHeading(esc(topic.name),'RESULTADO','ETAPA 5 · SEU DESEMPENHO')}<section class="result-hero"><div class="result-score">${s.pct}%</div><div><h2>${s.pct>=75?'Boa evolução neste módulo':'Este módulo pede mais uma revisão'}</h2><p>${s.correct} acertos e ${s.wrong} pontos para revisar em ${s.total} questões.</p></div></section><div class="result-grid"><div class="result-stat"><b>${s.pct}%</b><span>Percentual de acertos</span></div><div class="result-stat"><b>${100-s.pct}%</b><span>Percentual de erros</span></div><div class="result-stat"><b>${s.correct}</b><span>Questões corretas</span></div><div class="result-stat"><b>${s.wrong}</b><span>Questões para revisar</span></div></div>${renderLevelScore(s)}<div class="flow-actions"><button class="secondary" onclick="goToReview()">Revisar conceitos e erros</button><button onclick="startExtra()">Fazer mais exercícios</button><button class="secondary" onclick="dashboard()">Voltar à trilha</button></div></div>`;}
function renderReview(){const wrong=flow.wrongs||[];$('#app').innerHTML=`<div class="learning-shell">${showSteps('review')}${flowHeading('Revisão do módulo','REVISÃO GUIADA','CONCEITOS A RETOMAR')}<p class="flow-intro">Use cada erro como pista: leia o conceito, compare a pergunta e refaça o raciocínio.</p>${wrong.length?`<div class="review-list">${wrong.map((w,i)=>`<article class="review-card"><span class="eyebrow">${String(i+1).padStart(2,'0')} · ${esc(w.difficulty||'Revisão')} · ${esc(w.concept)}</span><h3>${esc(w.q)}</h3><p><b>Resposta esperada:</b> ${esc(w.answer)}</p><p>${esc(w.explanation)}</p><p><strong>Resolução comentada:</strong> ${esc(w.solution||w.explanation)}</p></article>`).join('')}</div>`:'<div class="summary-card"><h2>Você acertou todas as questões.</h2><p>Continue praticando para fixar os conceitos.</p></div>'}<div class="flow-actions"><button class="secondary" onclick="backToResults()">Voltar ao resultado</button><button onclick="startExtra()">Praticar mais</button></div></div>`;}
function startExtra(){flow.phase='extra';flow.extraIndex=0;flow.extraAnswers={};flow.showHint=false;persistFlow();renderFlow();}
window.modulePrompt=modulePrompt;window.chooseLevel=chooseLevel;window.answerQuiz=answerQuiz;window.advanceQuiz=advanceQuiz;window.toggleHint=toggleHint;window.checkExercise=checkExercise;window.advanceExercise=advanceExercise;window.backFromExercise=backFromExercise;window.startExtra=startExtra;window.saveExerciseDraft=saveExerciseDraft;window.backToLevel=backToLevel;window.startModuleQuiz=startModuleQuiz;window.backToSummary=backToSummary;window.goToReview=goToReview;window.backToResults=backToResults;
dashboard=function(){if(!account){authScreen('login');return;}page='home';nav();const ts=activeTopics(),done=ts.filter(t=>state.done[t.id]).length,pct=ts.length?Math.round(done/ts.length*100):0,next=ts.find(t=>!state.done[t.id])||ts[0];$('#app').innerHTML=`<div class="dashboard"><div class="welcome-row"><div class="welcome-copy"><span class="pill">SUA ÁREA DE ESTUDOS</span><h1>Olá, ${esc(account.name)}</h1><p class="muted">Continue de onde parou. Cada módulo concluído abre o próximo.</p></div><div class="profile-dot">${esc((account.name||'T').slice(0,1).toUpperCase())}</div></div><section class="welcome-hero"><div><span class="art-kicker">PRÓXIMA ETAPA · ${done} DE ${ts.length} CONCLUÍDAS</span><h2>${next?esc(next.name):'Trilha concluída'}</h2><p>${next?'Escolha seu ponto de partida e avance no seu ritmo.':'Você concluiu todos os módulos selecionados.'}</p>${next?`<button onclick="modulePrompt('${next.id}')">Começar módulo</button>`:'<button onclick="special(\'progress\')">Ver progresso</button>'}</div></section><div class="dash-columns"><section class="journey-card"><div class="journey-top"><div><span class="pill">TRILHA DE APRENDIZAGEM</span><h2>Seu caminho</h2><p>${done} de ${ts.length} módulos concluídos</p></div><div class="journey-progress"><b>${pct}%</b><div class="bar"><i style="width:${pct}%"></i></div></div></div><div class="map"><div class="map-banner">CAMINHO DO CONHECIMENTO</div>${ts.map((t,i)=>{const locked=i>done&&!state.done[t.id];return `<button class="module-node ${state.done[t.id]?'done':''} ${locked?'locked':''}" ${locked?'disabled':''} onclick="modulePrompt('${t.id}')"><span class="node-icon"><span>${String(i+1).padStart(2,'0')}</span></span><span class="node-copy"><b>${esc(t.name)}</b></span></button>`}).join('')}</div></section><aside class="dash-side"><section class="widget"><h3>Conteúdos da trilha</h3><div class="course-mini">${ts.map((t,i)=>`<div class="course-row"><div class="course-row-top"><b>${esc(t.name)}</b><span>${state.done[t.id]?'Concluído':i===done?'Disponível':'Bloqueado'}</span></div><div class="bar"><i style="width:${state.done[t.id]?100:i===done?25:0}%;background:${['#8e203e','#b94d68','#cf8296','#702039'][i%4]}"></i></div></div>`).join('')}</div></section></aside></div></div>`;};
// Mantém a tela de metas disponível na navegação, sem exibir metas ou gráficos na home.
save();dashboard();
})();









</script><script>nav=function(){const side=document.getElementById("nav"),layout=document.querySelector(".layout"),show=!!account&&!['auth','onboard'].includes(page);if(layout)layout.classList.toggle("no-side",!show);if(!side)return;side.hidden=!show;if(!show){side.replaceChildren();return;}const initials=(account.name||"E").slice(0,1).toUpperCase();side.innerHTML=`<div class="side-person"><div class="side-avatar">${esc(initials)}</div><div><b>${esc(account.name)}</b><small>Minha área de estudos</small></div></div><div class="side-caption">NAVEGAÇÃO</div><button class="side-link ${page==='home'?'active':''}" onclick="dashboard()"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span>Minha trilha</button><button class="side-link ${page==='goals'?'active':''}" onclick="special('goals')"><span class="side-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>Metas</button><button class="side-link ${page==='progress'?'active':''}" onclick="special('progress')"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h17M8 15l4-4 3 2 5-7"/></svg></span>Progresso</button><button class="side-link ${page==='profile'?'active':''}" onclick="special('profile')"><span class="side-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Meu perfil</button><div class="side-spacer"></div><button class="side-link side-logout" onclick="logout()"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3m8-9h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8"/></svg></span>Sair da conta</button>`;};
const previousDashboardForScroll=dashboard;dashboard=function(){previousDashboardForScroll();const scrollableTrail=document.querySelector(".map");if(scrollableTrail){const steps=[...scrollableTrail.querySelectorAll(".module-node")].reverse();steps.forEach(step=>scrollableTrail.append(step));scrollableTrail.setAttribute("tabindex","0");scrollableTrail.setAttribute("role","region");scrollableTrail.setAttribute("aria-label","Trilha de aprendizagem. Role para cima para ver os próximos módulos.");scrollableTrail.scrollTop=scrollableTrail.scrollHeight;}};
if(account&&sessionStorage.getItem("gt-session")==="1")dashboard();else authScreen("login");
</script></body></html>
